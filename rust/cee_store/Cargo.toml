[package]
name = "cee_store"
version = "0.1.0"
edition = "2021"
description = "Běhy CEE v souborech vedle projektu: zadání, snímky, slovník v čase, kontrolní body, výsledek"
publish = false
license = "MIT"

[dependencies]
cee_engine = { path = "../cee_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Velké JSON a kontrolní body se ukládají zabalené (MIT nebo Apache-2.0).
flate2 = "1"
