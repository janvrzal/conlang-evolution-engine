# Malý, vždy dostupný náhradní sémantický graf.
#
# Skutečná data (CLICS4 + DatSemShift) se stahují a staví mimo repo do
# ~/.cee/semantics/graph.graphml (viz cee/semantics/builder.py) — podle
# AGENT.md se necommitují. Tenhle soubor je fallback pro čerstvý klon nebo
# CI, kde ta cache neexistuje: `pipeline.resolve_semantics_path` na něj
# spadne automaticky, když reálný graf nenajde.
#
# Koncepty odpovídají `id` v src/cee/data/concepts.json (anglicky, malými
# písmeny) — to je slovník, který `ProtolangGenerator` reálně používá.
# `SemanticGraph` porovnává case-insensitive (normalizuje na velká
# písmena), takže tenhle mock funguje beze změny.
