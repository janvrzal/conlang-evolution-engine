# Kalibrační scénář; není rekonstrukcí skutečných dějin ani skutečných forem.
# Každý kořen dostane vlastní protolexikon přes run_multiroot_simulation.
scenario:
  id: european-contact-calibration
  description: "Česko–německo–anglicko–francouzský kontrolní scénář s oddělenou dědičností a doloženými typy kontaktu."
  measure: asjp_ldnd
  calibration_targets:
    # Tyto cíle se vyhodnocují nad mediánem více seedů. Neřídí jednotlivý běh.
    metric_targets:
      english-german:
        - {path: lexical.ldnd, target: 0.702, tolerance: 0.08, weight: 3.0}
      english-french:
        - {path: lexical.ldnd, target: 0.917, tolerance: 0.08, weight: 2.0}
        - {path: contact_left.loan_ratio, target: 0.05, tolerance: 0.03, weight: 1.0}
      czech-german:
        - {path: lexical.ldnd, target: 0.925, tolerance: 0.08, weight: 2.0}
        - {path: contact_left.loan_ratio, target: 0.05, tolerance: 0.03, weight: 1.0}
    cognate_proximity:
      english-german: 0.578
      english-french: 0.236
      czech-german: 0.259
      czech-french: 0.231
nodes:
  - id: proto_germanic
    year: 0
    isProto: true
    label: "Proto-germánština"
    phonology: {temperature: 0.62}
  - id: proto_romance
    year: 0
    isProto: true
    label: "Proto-románština"
    phonology: {temperature: 0.58}
  - id: proto_slavic
    year: 0
    isProto: true
    label: "Proto-slovanština"
    phonology: {temperature: 0.55}
  - id: english
    year: 500
    label: "Angličtina"
    phonology: {temperature: 0.62}
    divergence: {phonological_rate: 1.45, lexical_rate: 1.80, morphological_rate: 1.25, contact_permeability: 1.25}
    lexical: {enabled: true, replacement_rate: 0.020, loss_rate: 0.002, innovation_rate: 0.018, innovation_sources: {expressive: 0.45, trade_slang: 0.35, local_substrate: 0.20}}
  - id: german
    year: 500
    label: "Němčina"
    phonology: {temperature: 0.62}
    divergence: {phonological_rate: 1.10, lexical_rate: 0.90, morphological_rate: 0.90, contact_permeability: 0.70}
    lexical: {enabled: true, replacement_rate: 0.010, loss_rate: 0.002, innovation_rate: 0.006, innovation_sources: {expressive: 0.50, child_speech: 0.30, local_substrate: 0.20}}
  - id: french
    year: 500
    label: "Francouzština"
    phonology: {temperature: 0.58}
    divergence: {phonological_rate: 1.30, lexical_rate: 1.10, morphological_rate: 1.15, contact_permeability: 1.10}
    lexical: {enabled: true, replacement_rate: 0.014, loss_rate: 0.002, innovation_rate: 0.010, innovation_sources: {expressive: 0.45, trade_slang: 0.30, local_substrate: 0.25}}
  - id: czech
    year: 500
    label: "Čeština"
    phonology: {temperature: 0.55}
    divergence: {phonological_rate: 1.15, lexical_rate: 1.00, morphological_rate: 1.10, contact_permeability: 0.85}
    lexical: {enabled: true, replacement_rate: 0.012, loss_rate: 0.002, innovation_rate: 0.008, innovation_sources: {expressive: 0.50, child_speech: 0.25, local_substrate: 0.25}}
vertical_edges:
  - {parent: proto_germanic, child: english, rules: []}
  - {parent: proto_germanic, child: german, rules: []}
  - {parent: proto_romance, child: french, rules: []}
  - {parent: proto_slavic, child: czech, rules: []}
contact_edges:
  # Kalibrováno přes tři nezávislé seedy; rozpočet zůstává omezen po doménách.
  - {year: 1066, source: french, target: english, volume: 12, mutual: false, domain: polity, prestige: 1.5, adapt: true}
  - {year: 1200, source: german, target: czech, volume: 9, mutual: true, domain: trade, prestige: 1.1, adapt: true}
  - {year: 1750, source: french, target: german, volume: 6, mutual: false, domain: elite, prestige: 1.2, adapt: true}
