# Kalibrační scénář; není rekonstrukcí skutečných dějin ani skutečných forem.
# Každý kořen dostane vlastní protolexikon přes run_multiroot_simulation.
scenario:
  id: european-contact-calibration
  description: "Česko–německo–anglicko–francouzský kontrolní scénář s oddělenou dědičností a doloženými typy kontaktu."
  measure: asjp_ldnd
  calibration_targets:
    cognate_proximity:
      english-german: 0.578
      english-french: 0.236
      czech-german: 0.259
      czech-french: 0.231
nodes:
  - id: proto_germanic
    year: 0
    isProto: true
    label: "Proto-germánština"
    phonology: {temperature: 0.62}
  - id: proto_romance
    year: 0
    isProto: true
    label: "Proto-románština"
    phonology: {temperature: 0.58}
  - id: proto_slavic
    year: 0
    isProto: true
    label: "Proto-slovanština"
    phonology: {temperature: 0.55}
  - id: english
    year: 500
    label: "Angličtina"
  - id: german
    year: 500
    label: "Němčina"
  - id: french
    year: 500
    label: "Francouzština"
  - id: czech
    year: 500
    label: "Čeština"
vertical_edges:
  - {parent: proto_germanic, child: english, rules: []}
  - {parent: proto_germanic, child: german, rules: []}
  - {parent: proto_romance, child: french, rules: []}
  - {parent: proto_slavic, child: czech, rules: []}
contact_edges:
  - {year: 1066, source: french, target: english, volume: 4, mutual: false, domain: polity, prestige: 1.5, adapt: true}
  - {year: 1200, source: german, target: czech, volume: 3, mutual: true, domain: trade, prestige: 1.1, adapt: true}
  - {year: 1750, source: french, target: german, volume: 2, mutual: false, domain: elite, prestige: 1.2, adapt: true}
