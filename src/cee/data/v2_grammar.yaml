# Katalog gramatických funkcí enginu v2 (milník M4b).
#
# Funkce není modul v kódu, ale řádek zde. Jestli ji jazyk „má“, se
# nenastavuje: vyplývá z toho, čím ji právě vyjadřuje. Varianta „zero“
# (nevyjadřuje se) existuje u každé funkce šablony inflection, takže
# kategorie může vzniknout gramatikalizací i zaniknout erozí.
#
# Pole:
#   template     inflection (koncovka / opis / nic), negation (Jespersenův
#                cyklus), order (slovosled)
#   domain       noun | verb | clause
#   cell         buňka paradigmatu při syntetickém vyjádření
#   weight       váha buňky v užívání (frekvence tvaru = lexém × váha)
#   need         jak moc funkci komunikace potřebuje (0 až 1); řídí tlak
#                k obnově zeslabeného vyjádření
#   context      jak dobře funkci nese diskurzní a pragmatický kontext bez
#                gramatického vyjádření (0 až 1; C2); snižuje efektivní potřebu.
#                Číselné hodnoty jsou autorský odhad (modelový parametr);
#                typologická literatura podporuje relativní pořadí funkcí
#                podle kontextové zastupitelnosti, nikoli konkrétní čísla.
#                DEFINITE (0,16) a FUTURE (0,44) a coverage vidu (0,9) jsou
#                z kalibrace M7a (docs/engine-v2/12-kalibrace-m7a.md).
#   sources      zdroje gramatikalizace: autorský výběr nejčastějších cest
#                podle Heine & Kuteva 2002 a Hopper & Traugott 2003
#   compensates  funkce, jejichž roli může tato funkce převzít
#   coverage     jakou část jejich role nese, když se vyjadřuje (0 až 1;
#                pevný slovosled 0,9 podle Siewierska 1998, ostatní odhad)
#   donors       funkce téže třídy slov, jejichž zbytkovou koncovku si tato
#                funkce může vzít (exaptace, Lass 1990)
#   orders       možné pevné slovosledy (šablona order)
functions:
  PAST:
    template: inflection
    domain: verb
    cell: PAST
    # Minulý čas vybledne do kontrafaktuálu a irreálu (angl. if I had; Bybee, Perkins a Pagliuca
    # 1994) a funkci převezme nový opis (perfektum → minulý čas); M7.3l.
    bleaches: true
    weight: 0.5
    need: 1.0
    context: 0.25
    sources: [have, finish, come]
  FUTURE:
    template: inflection
    domain: verb
    cell: FUT
    # Futurum vybledne do modálního nebo epistémického významu a obnoví se opisem
    # (Bybee, Perkins a Pagliuca 1994, The Evolution of Grammar; lat. cantabo → cantare habeo).
    bleaches: true
    weight: 0.3
    need: 0.4
    context: 0.44
    # „mít“: futurum z vlastnictví a povinnosti (lat. cantare habeo; Bybee, Perkins a Pagliuca
    # 1994), přidáno v M7.3.
    sources: [go, want, have]
  PL:
    template: inflection
    domain: noun
    cell: PL
    # Plurálová koncovka vybledne v kolektiv nebo ukazatel jmenné třídy (Corbett 2000, Number;
    # Greenberg 1978); M7.3l.
    bleaches: true
    weight: 0.4
    need: 0.6
    # Plurál je povinný u všech jmen jen asi u 46 % jazyků (WALS 34A, Haspelmath 2013,
    # Occurrence of Nominal Plurality); jinde plurálnost často nese kontext. 0,3 → 0,5 v M7.2b.
    context: 0.50
    sources: [many, all]
  OBJ:
    template: inflection
    domain: noun
    cell: OBJ
    weight: 0.5
    need: 1.0
    context: 0.10
    sources: []
  DEFINITE:
    template: inflection
    domain: noun
    cell: DEF
    # Vázaný člen může vyblednout v ukazatel jména bez určitosti (Greenberg 1978,
    # How does a language acquire gender markers?, stadium III); změna `bleaching`.
    bleaches: true
    # Potřeba členu roste se slabostí pádu předmětu: need × (1 + 2 × slabost OBJ). WALS 37A × 49A
    # (176 jazyků): člen má 65 % jazyků bez pádů, 35 % jazyků se 4 a víc pády (genusově 0,62 a 0,47);
    # románský člen vznikl s přestavbou jmenné fráze po zániku pádů. M7.3n.
    reinforced_by: {OBJ: 2.0}
    weight: 0.6
    need: 0.25
    context: 0.16
    sources: [that, this]
    donors: [OBJ]
  ASPECT:
    # Vid (dokonavost): ukončený děj ze slovesa „dokončit“ (completive →
    # perfective; Bybee, Perkins & Pagliuca 1994, kap. 3). Jazyky bez
    # minulého času nesou časové zařazení videm a příslovci (Dahl 1985), proto
    # vid zastupuje PAST. need a context jsou autorský odhad, coverage z M7a.
    template: inflection
    domain: verb
    cell: PFV
    weight: 0.4
    need: 0.5
    context: 0.3
    sources: [finish]
    compensates: [PAST]
    coverage: 0.9
  NEG:
    template: negation
    domain: clause
    need: 0.5
    context: 0.0
    sources: [thing, step, one]
  ORDER:
    template: order
    domain: clause
    need: 0.0
    context: 0.0
    orders: [SOV, SVO]
    compensates: [OBJ]
    coverage: 0.9
