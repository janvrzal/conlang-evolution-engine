<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Poloostrov: editor světa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: nahoře cesta práce (Svět → … → Větve), vlevo nástroje a podklad, uprostřed mapa, vpravo karta kraje; červená tužka = ruka autora. */
:root {
  --sea: #bccad0;
  --sea-line: #eef3f4;
  --land: #fbfbf9;
  --ink: #1b2830;
  --ink-2: #56656e;
  --rule: #d1d9dc;
  --panel: #eef1f2;
  --field: #f7f9f9;
  --isogloss: #ae2a1f;
  --warn: #9a6a12;
  --halo: rgba(251, 251, 249, 0.9);
  --tint: rgba(174, 42, 31, 0.07);
  --grain: 0.07;
  --f-ui: "Piazzolla", Georgia, serif;
}
@font-face { font-family: "Charis CEE"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
.ipa { font-family: "Charis CEE", "Charis SIL", "Gentium Plus", serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --rule: #26323d;
    --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --warn: #d9a54a; --halo: rgba(23, 32, 42, 0.86);
    --tint: rgba(232, 128, 111, 0.09); --grain: 0.06; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --rule: #26323d;
  --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --warn: #d9a54a; --halo: rgba(23, 32, 42, 0.86);
  --tint: rgba(232, 128, 111, 0.09); --grain: 0.06; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--panel); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--isogloss); outline-offset: 2px; }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; color: var(--ink-2); }

.app {
  height: 100%; display: grid; gap: 10px 12px;
  grid-template-columns: 172px minmax(0, 1fr) 320px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "rail stage insp" "foot foot foot";
}

/* cesta práce */
.top { grid-area: top; display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.project { font-size: 22px; font-style: italic; }
.project small { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 8px; }
.path { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; align-items: baseline; }
.path li { display: flex; align-items: baseline; gap: 4px; }
.path li + li::before { content: ""; width: 22px; border-top: 1px dotted var(--ink-2); align-self: center; }
.path a { color: var(--ink-2); text-decoration: none; padding: 2px 4px; font-size: 15px; }
.path a b { font-weight: 500; font-size: 11px; margin-right: 4px; font-variant-numeric: lining-nums; }
.path a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--isogloss); }
.path a:hover { color: var(--ink); }
.saved { margin-left: auto; font-size: 12px; color: var(--ink-2); font-style: italic; }

/* nástroje a podklad */
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; }
.tools { display: grid; gap: 2px; }
.tool { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 8px; background: none; border: 0; padding: 5px 6px; border-radius: 2px; cursor: pointer; text-align: left; }
.tool kbd { font: 700 12px/1 var(--f-ui); width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--ink-2); border-radius: 2px; color: var(--ink-2); }
.tool:hover { background: var(--field); }
.tool[aria-pressed="true"] kbd { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tool[aria-pressed="true"] { font-weight: 700; }
.tool[disabled] { opacity: 0.45; cursor: default; }
.tool small { display: block; font-size: 11px; color: var(--ink-2); font-weight: 400; }
.layer { display: grid; gap: 8px; }
.layer .file { font-size: 13px; font-style: italic; overflow-wrap: anywhere; }
.layer label { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
input[type="range"] { accent-color: var(--ink); width: 100%; }
input[type="checkbox"] { accent-color: var(--ink); }
[hidden] { display: none !important; }

/* mapa */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--sea); border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; touch-action: none; }
.stage[data-tool="select"] canvas { cursor: default; }
.stage[data-tool="region"] canvas { cursor: copy; }
.stage[data-tool="link"] canvas { cursor: crosshair; }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--halo); padding: 5px 12px; border-radius: 2px; font-size: 13px; font-style: italic; pointer-events: none; max-width: calc(100% - 24px); text-align: center; }

/* karta kraje */
.insp { grid-area: insp; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.name-input { width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: none; font-size: 28px; font-weight: 700; padding: 2px 0; }
.ledger { margin: 0; display: grid; }
.row { display: grid; gap: 4px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.row dt { display: flex; justify-content: space-between; gap: 8px; }
.row dd { margin: 0; }
.why { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.35; }
.row .why { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.35; }
.row output { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 500; }
.seg { display: flex; gap: 0; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 3px 9px 4px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--isogloss); }
.seg button:first-child { padding-left: 0; }
select { width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 2px; padding: 5px 6px; }
.neigh { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.neigh li { display: flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 2px; padding: 1px 2px 1px 8px; font-size: 13px; background: var(--field); }
.neigh li.sea { border-style: dashed; }
.neigh button { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 0 5px; font-size: 15px; line-height: 1; }
.neigh button:hover { color: var(--isogloss); }
.danger { align-self: flex-start; background: none; border: 0; color: var(--isogloss); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.checks li { padding-left: 14px; position: relative; }
.checks li::before { content: ""; position: absolute; left: 0; top: 0.45em; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.checks li.err::before { background: var(--isogloss); }
.checks li.ok::before { background: var(--ink-2); }
.checks button { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.name-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 6px; font-size: 14px; }
.name-meta .ipa { font-size: 16px; }
.name-meta .mean { font-style: italic; }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.link:hover { color: var(--isogloss); }
.derived { font-size: 13px; font-variant-numeric: tabular-nums; }
.tl { display: grid; gap: 5px; }
.tl-bar { position: relative; height: 22px; border: 1px solid var(--ink-2); border-radius: 2px; background: var(--land); }
.tl-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 5px; font-size: 11.5px; overflow: hidden; white-space: nowrap; border-right: 1px solid var(--ink-2); }
.tl-seg:last-of-type { border-right: 0; }
.tl-seg.v-shared, .tl-seg.v-false { color: var(--ink-2); }
.tl-seg.v-distinct { background: repeating-linear-gradient(135deg, var(--field) 0 4px, var(--rule) 4px 6px); }
.tl-seg.v-strong { background: var(--ink-2); color: var(--panel); }
.tl-seg.v-true { background: var(--ink); color: var(--panel); }
.tl-h { position: absolute; top: -5px; bottom: -5px; width: 13px; margin-left: -6px; cursor: ew-resize; touch-action: none; z-index: 1; }
.tl-h::after { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 3px; background: var(--isogloss); border-radius: 1px; }
.tl-h:focus-visible { outline: 2px solid var(--isogloss); }
.tl-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tl-list li { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13px; }
.tl-list .yrs { min-width: 78px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl-list input[type="number"] { width: 54px; border: 0; border-bottom: 1px solid var(--ink-2); background: none; padding: 0 2px; font-size: 13px; }
.tl-list .seg button { font-size: 13px; padding: 2px 7px 3px; }
.tl-x { border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 15px; padding: 0 4px; }
.tl-x:hover { color: var(--isogloss); }

/* zápatí */
.foot { grid-area: foot; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 8px; }
.counts { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 700; }
.foot .spacer { margin-left: auto; }
.btn { border: 1px solid var(--ink); background: none; padding: 6px 14px; border-radius: 2px; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--panel); }
.btn.primary:hover { background: var(--isogloss); border-color: var(--isogloss); }
.spec { grid-column: 1 / -1; width: 100%; display: grid; gap: 6px; }
.spec pre { margin: 0; max-height: 240px; overflow: auto; background: var(--field); border: 1px solid var(--rule); padding: 10px; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 62vh auto auto;
    grid-template-areas: "top" "rail" "stage" "insp" "foot"; }
  .rail { flex-direction: row; flex-wrap: wrap; overflow: visible; }
  .tools { grid-auto-flow: column; }
  .tool small { display: none; }
  .layer { flex: 1 1 220px; }
  .saved { margin-left: 0; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="project">Poloostrov<small>2000 let, krok 25 let</small></div>
    <nav aria-label="Postup práce">
      <ol class="path">
        <li><a href="#svet" aria-current="page"><b>1</b>Svět</a></li>
        <li><a href="#proto"><b>2</b>Protojazyk</a></li>
        <li><a href="#dejiny"><b>3</b>Dějiny</a></li>
        <li><a href="#vysledky"><b>4</b>Výsledky</a></li>
        <li><a href="#vetve"><b>5</b>Větve</a></li>
      </ol>
    </nav>
    <span class="saved" id="saved">Všechny změny uložené</span>
  </header>

  <aside class="rail" aria-label="Nástroje">
    <div class="tools" role="group" aria-label="Nástroj">
      <span class="caps" style="margin-bottom:4px">Nástroje</span>
      <button class="tool" data-tool="select" aria-pressed="true"><kbd>V</kbd><span>Výběr<small>klik, tažení bodu</small></span></button>
      <button class="tool" data-tool="region" aria-pressed="false"><kbd>R</kbd><span>Kraj<small>klik na pevninu</small></span></button>
      <button class="tool" data-tool="link" aria-pressed="false"><kbd>S</kbd><span>Spoj<small>kraj, pak druhý kraj</small></span></button>
      <button class="tool" disabled title="V prototypu je pobřeží dané podkladem"><kbd>K</kbd><span>Pobřeží<small>kapátko na moře</small></span></button>
      <button class="tool" disabled title="V prototypu je měřítko dané"><kbd>M</kbd><span>Měřítko<small>dva body a km</small></span></button>
    </div>
    <div class="layer">
      <span class="caps">Podklad</span>
      <span class="file">poloostrov-azgaar.png</span>
      <label class="toggle"><input type="checkbox" id="atlas"> Čistý atlas bez podkladu</label>
      <label>Viditelnost podkladu <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7"></label>
      <label>Odbarvení <input type="range" id="desat" min="0" max="1" step="0.05" value="0.55"></label>
      <label class="toggle"><input type="checkbox" id="cells" checked> Území krajů</label>
    </div>
  </aside>

  <main class="stage" id="stage" data-tool="select">
    <canvas id="map" aria-label="Mapa světa s kraji a spoji"></canvas>
    <div class="hint" id="hint" hidden></div>
  </main>

  <section class="insp" id="insp" aria-live="polite"></section>

  <footer class="foot">
    <span class="counts" id="counts"></span>
    <button class="btn" id="undo" title="Ctrl+Z">Zpět</button>
    <button class="btn" id="show-spec" aria-expanded="false">Popis světa pro engine</button>
    <span class="spacer"></span>
    <button class="btn primary" id="next">Pokračovat: Protojazyk →</button>
    <div class="spec" id="spec" hidden>
      <span class="caps">cee-v2-world/1, přesně to, co dostane engine</span>
      <p class="why" id="spec-note" style="margin:0;font-size:13px;color:var(--warn)"></p>
      <pre id="spec-json"></pre>
    </div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  // Pevná geografie podkladu (km). Kraje jsou body nad ní; pobřeží se nemění, když autor kraje přesouvá.
  const GEO = [
    ['Vardun', 40, 120, 'plain'], ['Selm', 85, 95, 'plain'], ['Orra', 70, 150, 'plain'], ['Kestrin', 120, 130, 'plain'],
    ['Bal', 30, 175, 'plain'], ['Tumar', 110, 180, 'hills'], ['Hesk', 150, 90, 'hills'], ['Ivel', 160, 160, 'mountains'],
    ['Dorn', 185, 115, 'mountains'], ['Kaar', 175, 210, 'hills'], ['Mirost', 225, 145, 'plain'], ['Pelna', 235, 95, 'plain'],

    ['Nask', 60, 225, 'plain'], ['Ebb', 140, 240, 'plain'], ['Lisk', 105, 300, 'island'], ['Corrin', 210, 240, 'plain'],
  ];
  const OFFS = [[0, 0], [10, 0], [-5, 8.66], [-5, -8.66]];
  const GP = [], GI = [];
  GEO.forEach(([, x, y, t]) => OFFS.forEach(([dx, dy]) => { GP.push([x + dx, y + dy]); GI.push(t === 'island'); }));
  const MOUNT = GEO.filter(g => g[3] === 'mountains').map(g => [g[1], g[2]]);
  const HILL = GEO.filter(g => g[3] === 'hills').map(g => [g[1], g[2]]);

  function hash(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
  function vnoise(x, y) {
    const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
    return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
  }
  function landField(x, y) {
    let main = Infinity, island = Infinity;
    for (let n = 0; n < GP.length; n++) {
      const dx = GP[n][0] - x, dy = GP[n][1] - y, d = dx * dx + dy * dy;
      if (GI[n]) { if (d < island) island = d; } else if (d < main) main = d;
    }
    const noise = vnoise(x / 24, y / 24) * 8 + vnoise(x / 8 + 40, y / 8) * 2.6;
    const fm = 34 - Math.sqrt(main) + noise, fi = 34 - Math.sqrt(island) + noise;
    if (fm > -14 && fi > -14) return Math.min(Math.max(fm, fi), -3 - Math.min(Math.abs(fm - fi), 6));
    return Math.max(fm, fi);
  }
  function relief(x, y) {
    let m = 0;
    for (const [mx, my] of MOUNT) m = Math.max(m, 1 - Math.hypot(mx - x, my - y) / 34);
    let h = 0;
    for (const [hx, hy] of HILL) h = Math.max(h, 1 - Math.hypot(hx - x, hy - y) / 30);
    return Math.max(0, m) * 0.9 + Math.max(0, h) * 0.45 + vnoise(x / 9, y / 9) * 0.08;
  }

  // --- interakce na mapě ---

  let hintTimer = null;

  // --- karta kraje ---
  const TERRAIN = [['plain', 'rovina', 'Lidé a slova se šíří volně.'], ['hills', 'pahorkatina', 'Cesty jsou delší; nová slova sem dorazí o něco později.'],

  function checks() {

  // --- zápatí a popis světa ---

  const NEW_KINDS = new Set(['identity', 'immigration']);
  function spec() {

      const o = { id: r.id, name: r.name, position: [r.x, r.y], neighbours: neighboursOf(r.id).sort(), villages: villagesOf(r), language: r.language, terrain: r.terrain };
      const d = settleOf(r)[2]; if (d !== 1) o.density = d;

      const sp = spec(), fresh = [...new Set(sp.events.filter(e => NEW_KINDS.has(e.kind)).map(e => e.kind))];
      document.getElementById('spec-json').textContent = JSON.stringify(sp, null, 1);
      document.getElementById('spec-note').textContent = fresh.length ? `Druhy událostí ${fresh.join(' a ')} engine zatím nezná. Doplním je, až návrh schválíš.` : '';
    }
    document.getElementById('undo').disabled = !history.length;
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('show-spec').addEventListener('click', e => {
    const box = document.getElementById('spec'); box.hidden = !box.hidden; e.currentTarget.setAttribute('aria-expanded', String(!box.hidden)); renderFooter();
  });
  document.getElementById('next').addEventListener('click', () => showHint('Protojazyk je další obrazovka, kterou navrhneme.'));
  document.querySelectorAll('.path a').forEach(a => a.addEventListener('click', e => { if (a.getAttribute('aria-current') !== 'page') { e.preventDefault(); showHint('Tahle obrazovka ještě není navržená.'); } else e.preventDefault(); }));

  // --- podklad ---
  const atlasEl = document.getElementById('atlas'), opEl = document.getElementById('opacity'), deEl = document.getElementById('desat'), cellsEl = document.getElementById('cells');
  function syncLayer() { opEl.disabled = deEl.disabled = UI.atlas; }
  atlasEl.addEventListener('change', () => { UI.atlas = atlasEl.checked; syncLayer(); draw(); });
  opEl.addEventListener('input', () => { UI.opacity = +opEl.value; draw(); });
  deEl.addEventListener('input', () => { UI.desat = +deEl.value; draw(); });
  cellsEl.addEventListener('change', () => { UI.cells = cellsEl.checked; draw(); });

  function renderAll(dragging = false) { computeAreas(); draw(); if (!dragging) renderInspector(); renderFooter(); }
  new ResizeObserver(() => { layout(); draw(); }).observe(stage);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { grainPattern = null; draw(); });
  new MutationObserver(() => { grainPattern = null; draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  layout(); renderAll(); syncLayer();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>

</html>
