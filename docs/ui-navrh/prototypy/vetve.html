<title>Poloostrov: větve</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face { font-family: "Charis CEE"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
/* Layout: vlevo strom větví dějin, uprostřed dvě mapy vedle sebe (stejný rok) s řekami jazyků, vpravo co se mezi větvemi liší; červená = rozdíl. */
:root {
  --sea: #bccad0; --sea-line: #eef3f4; --land: #fbfbf9; --ink: #1b2830; --ink-2: #56656e; --ink-3: #a7b3b9; --rule: #d1d9dc;
  --panel: #eef1f2; --field: #f7f9f9; --isogloss: #ae2a1f; --halo: rgba(251, 251, 249, 0.9); --grain: 0.07;
  --l0: #2a6fc9; --l1: #c48a12; --l2: #16956a; --l3: #7d4fc0; --l4: #8a9a12; --l5: #c4508a;
  --f-ui: "Piazzolla", Georgia, serif; --f-ipa: "Charis CEE", "Charis SIL", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
    --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --halo: rgba(23, 32, 42, 0.86); --grain: 0.05;
    --l0: #4f8de0; --l1: #b47e18; --l2: #22a074; --l3: #9a72dc; --l4: #869217; --l5: #d05f98; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
  --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --halo: rgba(23, 32, 42, 0.86); --grain: 0.05;
  --l0: #4f8de0; --l1: #b47e18; --l2: #22a074; --l3: #9a72dc; --l4: #869217; --l5: #d05f98; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--isogloss); outline-offset: 2px; }
.ipa { font-family: var(--f-ipa); }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.why { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.38; margin: 0; }
.app { height: 100%; display: grid; gap: 10px 16px; grid-template-columns: 210px minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "tree main diff" "foot foot foot"; }
.top { grid-area: top; display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.project { font-size: 22px; font-style: italic; }
.project small { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 8px; }
.path { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; align-items: baseline; }
.path li { display: flex; align-items: baseline; gap: 4px; }
.path li + li::before { content: ""; width: 22px; border-top: 1px dotted var(--ink-2); align-self: center; }
.path a { color: var(--ink-2); text-decoration: none; padding: 2px 4px; }
.path a b { font-weight: 500; font-size: 11px; margin-right: 4px; }
.path a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--isogloss); }
.yr { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.yr b { font-size: 26px; font-variant-numeric: tabular-nums lining-nums; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--land); cursor: pointer; display: grid; place-items: center; }
.play svg { fill: var(--ink); }

/* strom větví */
.tree { grid-area: tree; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.tree svg { width: 100%; height: auto; display: block; }
.branch { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 2px; background: var(--field); }
.branch b { font-size: 16px; }
.branch ul { margin: 0; padding-left: 16px; font-size: 13px; }
.branch.b { border-color: var(--isogloss); }
.add { background: none; border: 1px dashed var(--ink-2); color: var(--ink-2); padding: 5px 8px; border-radius: 2px; cursor: pointer; text-align: left; font-size: 14px; }

/* mapy */
.main { grid-area: main; min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 150px; gap: 6px 10px; }
.main h2 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: baseline; }
.main h2 small { font-size: 12.5px; font-weight: 400; color: var(--ink-2); font-style: italic; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--sea); border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; cursor: pointer; }
.river { position: relative; min-height: 0; }
.river svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--land); border: 1px solid var(--ink); padding: 4px 8px; font-size: 13px; border-radius: 2px; white-space: nowrap; z-index: 4; }

/* rozdíly */
.diff { grid-area: diff; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.diff h3 { margin: 0 0 6px; }
.big { font-size: 26px; font-weight: 700; line-height: 1.1; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.cmp th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12px; padding: 3px 4px; border-bottom: 1px solid var(--ink); }
.cmp th.n, .cmp td.n { text-align: right; font-variant-numeric: tabular-nums; }
.cmp td { padding: 4px; border-bottom: 1px solid var(--rule); }
.cmp td i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.cmp td.only { color: var(--isogloss); font-style: italic; }
.cmp td.f { font-family: var(--f-ipa); font-size: 16px; }
.cmp td.f.chg { color: var(--isogloss); }
.delta { font-variant-numeric: tabular-nums; }
.delta.minus, .delta.plus { color: var(--isogloss); }

.foot { grid-area: foot; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 8px; font-size: 13px; color: var(--ink-2); }
.foot b { color: var(--ink); }

@media (max-width: 1100px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "top" "tree" "main" "diff" "foot"; }
  .main { grid-template-rows: auto 46vh 150px; }
  .yr { margin-left: 0; }
}
@media (max-width: 640px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; } .stage { height: 46vh; } .river { height: 150px; } }
</style>

      <div class="branch"><b>A · ${RUNS[0].name}</b><span class="why">dějiny, jak je máš v prototypu Dějin</span></div>
      <div class="branch b"><b>B · ${RUNS[1].name}</b><span class="why">odbočuje v roce ${fork}</span><ul>${eventDiff().map(t => `<li>${t}</li>`).join('')}</ul></div>`;
    document.getElementById('add-year').textContent = UI.year;
  }
  const plural = (n, a, b, c) => (n === 1 ? a : n >= 2 && n <= 4 ? b : c);
  function renderDiff() {
    const y = UI.year, diff = differs(y), n = diff.filter(Boolean).length, fa = A.frameAt(y), fb = B.frameAt(y);
    const ids = [...new Set([...orderOf(A).map(li => A.L[li].id), ...orderOf(B).map(li => B.L[li].id)])];
    const speakers = (X, f, id) => { const li = X.L.findIndex(l => l.id === id); if (li < 0) return null; return P.reduce((s, _, i) => s + (X.linAt(f, i) === li ? f.pop[i] : 0), 0); };
    const rows = ids.map(id => { const sa = speakers(A, fa, id), sb = speakers(B, fb, id); return { id, sa, sb }; }).filter(r => (r.sa || 0) + (r.sb || 0) > 0);
    const sw = id => { const X = A.L.some(l => l.id === id) ? A : B, li = X.L.findIndex(l => l.id === id); return `<i style="background:${color(X, li)}"></i>${nameOf(X, li)}`; };
    const i = UI.place, words = CONCEPTS.filter(c => !['we', 'good', 'speak', 'person'].includes(c)).map(c => ({ c, a: A.formAt(c, i, y), b: B.formAt(c, i, y) }));
    const changed = words.filter(w => w.a !== w.b);
    const la = A.linAt(fa, i), lb = B.linAt(fb, i);
    document.getElementById('diff').innerHTML = `
      <div><div class="caps">V roce ${y}</div><div class="big">${n} ${plural(n, 'ves mluví', 'vsi mluví', 'vsí mluví')} jinak</div>
        <p class="why">${n ? 'Na mapách jsou obtažené červeně.' : y < RUNS[1].fork ? `Do roku ${RUNS[1].fork} jsou obě větve stejné.` : 'Jazyky jsou v obou větvích na stejných místech.'}</p></div>
      <div><div class="caps" style="margin-bottom:4px">Mluvčí podle jazyka</div>
        <table class="cmp"><thead><tr><th>Jazyk</th><th class="n">A</th><th class="n">B</th><th class="n">rozdíl</th></tr></thead><tbody>
        ${rows.map(r => { const d = (r.sb ?? 0) - (r.sa ?? 0); return `<tr><td>${sw(r.id)}</td><td class="n${r.sa == null ? ' only' : ''}">${r.sa == null ? 'není' : r.sa.toLocaleString('cs')}</td><td class="n${r.sb == null ? ' only' : ''}">${r.sb == null ? 'není' : r.sb.toLocaleString('cs')}</td><td class="n delta ${d < 0 ? 'minus' : d > 0 ? 'plus' : ''}">${d === 0 ? '–' : (d > 0 ? '+' : '−') + Math.abs(d).toLocaleString('cs')}</td></tr>`; }).join('')}
        </tbody></table></div>
      <div><div class="caps" style="margin-bottom:4px">Ves ${placeLabel(i)}</div>
        <p class="why" style="margin-bottom:6px">A: ${la >= 0 ? nameOf(A, la) : '—'} · B: ${lb >= 0 ? nameOf(B, lb) : '—'}. ${changed.length} z ${words.length} slov se liší. Jinou ves vybereš klikem do mapy.</p>
        <table class="cmp"><thead><tr><th>Význam</th><th>A</th><th>B</th></tr></thead><tbody>
        ${(changed.length ? changed : words.slice(0, 8)).slice(0, 18).map(w => `<tr><td>${D.gloss[w.c]}</td><td class="f">${w.a ?? '∅'}</td><td class="f${w.a !== w.b ? ' chg' : ''}">${w.b ?? '∅'}</td></tr>`).join('')}
        </tbody></table></div>`;
  }

  // --- čas a vykreslení ---
  const playBtn = document.getElementById('play'), playIcon = document.getElementById('play-icon'); let timer = null;
  function setPlaying(on) { clearInterval(timer); UI.playing = on; playBtn.setAttribute('aria-label', on ? 'Zastavit' : 'Přehrát');
    playIcon.innerHTML = on ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>'; if (!on) return; if (UI.year >= END) UI.year = 0;
    timer = setInterval(() => { if (UI.year >= END) { setPlaying(false); return; } UI.year += 50; render(); }, 280); }
  playBtn.addEventListener('click', () => setPlaying(!UI.playing));
  document.getElementById('add').addEventListener('click', () => { const b = document.getElementById('add'); b.textContent = 'V prototypu se nové větve nepočítají.'; setTimeout(() => { b.innerHTML = `+ Nová větev z roku <span id="add-year">${UI.year}</span>`; }, 2200); });
  document.querySelectorAll('.path a').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { UI.year = Math.min(END, UI.year + 50); render(); } else if (e.key === 'ArrowLeft') { UI.year = Math.max(0, UI.year - 50); render(); } });
  function render() {
    document.getElementById('year').textContent = UI.year;
    document.getElementById('title-a').innerHTML = `A · ${RUNS[0].name}<small>rok ${UI.year}</small>`;
    document.getElementById('title-b').innerHTML = `<span style="color:var(--isogloss)">B</span>&nbsp;· ${RUNS[1].name}<small>${UI.year < RUNS[1].fork ? 'zatím stejné jako A' : 'od roku ' + RUNS[1].fork + ' jinak'}</small>`;
    const diff = differs(UI.year); MAPS.forEach(M => drawMap(M, diff));
    drawRiver(A, SER[0], document.getElementById('river-a'), document.getElementById('rsvg-a'), null);
    drawRiver(B, SER[1], document.getElementById('river-b'), document.getElementById('rsvg-b'), RUNS[1].fork);
    renderTree(); renderDiff();
    const living = X => new Set(P.map((_, i) => X.linAt(X.frameAt(UI.year), i)).filter(x => x >= 0)).size;
    document.getElementById('foot').innerHTML = `<span>A: <b>${living(A)}</b> ${plural(living(A), 'jazyk', 'jazyky', 'jazyků')}</span><span>B: <b>${living(B)}</b> ${plural(living(B), 'jazyk', 'jazyky', 'jazyků')}</span><span>Obě větve sdílejí svět, protojazyky a los; liší se jen událostmi od roku ${RUNS[1].fork}.</span>`;
  }
  function relayout() { MAPS.forEach(M => { M.G = geometry(M.stage, M.cv); }); render(); }
  new ResizeObserver(relayout).observe(document.querySelector('.main'));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  relayout();
  if (document.fonts) document.fonts.ready.then(render);
})();
</script>

</html>
