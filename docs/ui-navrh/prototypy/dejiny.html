<style>
@font-face { font-family: "Charis CEE"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
/* Layout: nahoře mapa světa v roce pod kurzorem, vpravo karta vybrané události, dole kronika: pruh pro každý stát, lingua francu a kraje. */
:root {
  --sea: #bccad0; --sea-line: #eef3f4; --land: #fbfbf9; --ink: #1b2830; --ink-2: #56656e; --ink-3: #a7b3b9; --rule: #d1d9dc;
  --panel: #eef1f2; --field: #f7f9f9; --isogloss: #ae2a1f; --warn: #9a6a12; --halo: rgba(251, 251, 249, 0.9); --tint: rgba(174, 42, 31, 0.08);
  --grain: 0.07; --f-ui: "Piazzolla", Georgia, serif; --f-ipa: "Charis CEE", "Charis SIL", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
    --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --warn: #d9a54a; --halo: rgba(23, 32, 42, 0.86); --tint: rgba(232, 128, 111, 0.16); --grain: 0.06; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
  --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --warn: #d9a54a; --halo: rgba(23, 32, 42, 0.86); --tint: rgba(232, 128, 111, 0.16); --grain: 0.06; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--isogloss); outline-offset: 2px; }
.ipa { font-family: var(--f-ipa); }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.why { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.38; margin: 0; }

.app { height: 100%; display: grid; gap: 10px 14px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "top top" "stage insp" "tl insp" "foot foot"; }
.top { grid-area: top; display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.project { font-size: 22px; font-style: italic; }
.project small { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 8px; }
.path { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; align-items: baseline; }
.path li { display: flex; align-items: baseline; gap: 4px; }
.path li + li::before { content: ""; width: 22px; border-top: 1px dotted var(--ink-2); align-self: center; }
.path a { color: var(--ink-2); text-decoration: none; padding: 2px 4px; }
.path a b { font-weight: 500; font-size: 11px; margin-right: 4px; }
.path a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--isogloss); }
.saved { margin-left: auto; font-size: 12px; color: var(--ink-2); font-style: italic; }

/* mapa */
.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; overflow: hidden; background: var(--sea); border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; }
.year-big { position: absolute; left: 18px; top: 12px; pointer-events: none; display: grid; gap: 2px; }
.year-big b { font-size: 40px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.year-big span { font-size: 13px; color: var(--ink-2); font-style: italic; }
.legend { position: absolute; right: 14px; bottom: 12px; background: var(--halo); padding: 8px 10px; border-radius: 2px; display: grid; gap: 4px; font-size: 13px; max-width: 280px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.legend canvas { position: static; width: 26px; height: 14px; flex: none; border: 1px solid var(--ink-2); }
.pickhint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--isogloss); color: var(--land); padding: 4px 12px; border-radius: 2px; font-size: 13px; pointer-events: none; }

/* kronika */
.tl { grid-area: tl; display: grid; gap: 6px; min-width: 0; }
.tl-head { display: flex; gap: 14px; align-items: center; position: relative; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: none; padding: 4px 12px; border-radius: 2px; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--panel); }
.btn.primary:hover { background: var(--isogloss); border-color: var(--isogloss); }
.menu { position: absolute; left: 90px; bottom: calc(100% + 4px); z-index: 5; background: var(--land); border: 1px solid var(--ink); border-radius: 2px; padding: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 240px)); gap: 2px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
.menu button { text-align: left; background: none; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 2px; display: grid; }
.menu button:hover { background: var(--field); }
.menu button small { font-size: 12px; color: var(--ink-2); font-style: italic; }
.chron { position: relative; display: grid; grid-template-columns: 170px minmax(0, 1fr); border-top: 1px solid var(--ink); user-select: none; }
.chron .lab { font-size: 13px; padding: 0 8px 0 0; display: flex; align-items: center; min-width: 0; border-bottom: 1px solid var(--rule); }
.chron .lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chron .lab.sub { color: var(--ink-2); font-style: italic; }
.track { position: relative; height: 34px; border-bottom: 1px solid var(--rule); }
.ruler { position: relative; height: 22px; cursor: ew-resize; }
.ruler span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ruler i { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--ink-2); }
.bar { position: absolute; top: 8px; height: 18px; border: 1px solid var(--ink); border-radius: 1px; overflow: hidden; display: flex; }
.bar .p { height: 100%; flex: none; }
.p-tolerant { background: var(--land); }
.p-promoted { background: repeating-linear-gradient(135deg, var(--land) 0 3px, var(--ink-3) 3px 5px); }
.p-enforced { background: var(--ink-2); }
.mk { position: absolute; top: 5px; height: 24px; transform: translateX(-1px); border: 0; background: none; padding: 0 0 0 4px; cursor: grab; display: flex; align-items: center; gap: 3px; font-size: 12px; white-space: nowrap; border-left: 2px solid var(--ink); }
.mk span { background: var(--halo); padding: 0 3px; border-radius: 1px; }
.mk.ro { cursor: default; border-left-style: dotted; color: var(--ink-2); }
.mk[aria-pressed="true"] { border-left-color: var(--isogloss); color: var(--isogloss); font-weight: 700; }
.mk.err span { box-shadow: inset 0 -2px 0 var(--warn); }
.mk.tight span { display: none; }
.cursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--isogloss); pointer-events: none; z-index: 3; }
.cursor b { position: absolute; top: 1px; left: 3px; font-size: 11px; color: var(--isogloss); font-variant-numeric: tabular-nums; background: var(--panel); padding: 0 3px; }

.title-input { width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: none; font-size: 24px; font-weight: 700; padding: 2px 0; }
.ledger { display: grid; }
.row { display: grid; gap: 4px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.row dt { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.row dd { margin: 0; }
.seg { display: flex; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 3px 9px 4px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; }
.seg button:first-child { padding-left: 0; }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--isogloss); }
select, input[type="number"] { background: var(--field); border: 1px solid var(--rule); border-radius: 2px; padding: 4px 6px; }
input[type="number"] { width: 80px; font-variant-numeric: tabular-nums; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { border: 1px solid var(--rule); background: var(--field); border-radius: 2px; padding: 0 7px; font-size: 13px; }
.pick { justify-self: start; border: 1px dashed var(--isogloss); color: var(--isogloss); background: none; padding: 3px 10px; border-radius: 2px; cursor: pointer; font-size: 13px; }
.pick[aria-pressed="true"] { background: var(--isogloss); color: var(--land); border-style: solid; }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.danger { align-self: flex-start; background: none; border: 0; color: var(--isogloss); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.checks li { padding-left: 14px; position: relative; }
.checks li::before { content: ""; position: absolute; left: 0; top: 0.45em; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.checks li.ok::before { background: var(--ink-2); }
.checks button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

.foot { grid-area: foot; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 8px; }
.counts { font-size: 13px; color: var(--ink-2); }
.counts b { color: var(--ink); }
.foot .spacer { margin-left: auto; }
.spec { width: 100%; display: grid; gap: 6px; }
.spec pre { margin: 0; max-height: 220px; overflow: auto; background: var(--field); border: 1px solid var(--rule); padding: 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; }

@media (max-width: 980px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56vh auto auto auto; grid-template-areas: "top" "stage" "tl" "insp" "foot"; }
  .chron { grid-template-columns: 110px minmax(0, 1fr); }
  .legend { display: none; }
  .menu { left: 0; grid-template-columns: minmax(0, 1fr); }
  .saved { margin-left: 0; }
}
</style>

</div>

<script>

    ['Nask', 60, 225, 'plain'], ['Ebb', 140, 240, 'plain'], ['Lisk', 105, 300, 'island'], ['Corrin', 210, 240, 'plain'],
  ];
  const OFFS = [[0, 0], [10, 0], [-5, 8.66], [-5, -8.66]];
  const GP = [], GI = [];
  GEO.forEach(([, x, y, t]) => OFFS.forEach(([dx, dy]) => { GP.push([x + dx, y + dy]); GI.push(t === 'island'); }));
  function hash(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
  function vnoise(x, y) {
    const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
    return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
  }
  function landField(x, y) {
    let main = Infinity, island = Infinity;
    for (let n = 0; n < GP.length; n++) { const dx = GP[n][0] - x, dy = GP[n][1] - y, d = dx * dx + dy * dy; if (GI[n]) { if (d < island) island = d; } else if (d < main) main = d; }
    const noise = vnoise(x / 24, y / 24) * 8 + vnoise(x / 8 + 40, y / 8) * 2.6;
    const fm = 34 - Math.sqrt(main) + noise, fi = 34 - Math.sqrt(island) + noise;
    if (fm > -14 && fi > -14) return Math.min(Math.max(fm, fi), -3 - Math.min(Math.abs(fm - fi), 6));

  }

  const LEX = {"i": "bapijekʷ", "you": "sa", "we": "pukah", "this": "puranakʷ", "that": "ka", "who": "kʷoɡa", "what": "kʷo", "not": "lap", "all": "pateb", "many": "rekedo", "one": "dokʷehekʷ", "two": "bowa", "big": "rorakʷakʷ", "long": "jo", "small": "ekʷa", "woman": "bupasi", "man": "mus", "person": "lipopi", "fish": "mopukem", "bird": "nanope", "dog": "amaba", "louse": "soɡema", "tree": "dapepe", "seed": "ɡa", "leaf": "serawa", "root": "ta", "bark": "saputu", "skin": "sim", "flesh": "mapopa", "blood": "pokʷow", "bone": "tawip", "grease": "pewam", "egg": "nuhas", "horn": "bodawa", "tail": "eti", "feather": "ɡekʷa", "hair": "bi", "head": "atiko", "ear": "kʷokʷokʷa", "eye": "bekʷeneh", "nose": "bedi", "mouth": "tuke", "tooth": "ɡalesap", "tongue": "ɡuɡoka", "fingernail": "pata", "foot": "iti", "leg": "peɡa", "knee": "leloda", "hand": "ɡite", "belly": "ko", "neck": "owa", "breasts": "pasonakʷ", "heart": "kise", "liver": "kakokʷo", "drink": "bas", "eat": "hika", "bite": "sibab", "see": "pu", "hear": "kikʷahi", "know": "pokeɡap", "sleep": "uta", "die": "kʷude", "kill": "te", "swim": "apap", "fly": "pipaka", "walk": "tala", "come": "deteko", "lie": "liɡop", "sit": "lewi", "stand": "kukato", "give": "rok", "say": "tu", "sun": "pekakʷi", "moon": "laja", "star": "pepaj", "water": "kʷipakʷa", "rain": "wumikʷo", "stone": "jato", "sand": "mote", "earth": "kituja", "cloud": "sekʷakah", "smoke": "iɡa", "fire": "ape", "ash": "koker", "burn": "kʷatap", "path": "woheta", "mountain": "kʷa", "red": "notikʷu", "green": "ku", "yellow": "wu", "white": "pe", "black": "hipa", "night": "seba", "hot": "latop", "cold": "paha", "full": "kʷep", "new": "saka", "good": "aweho", "round": "webapa", "dry": "mo", "name": "depi", "father": "pap", "mother": "paped", "child": "ɡepa", "family": "kupupu", "house": "kʷabani", "village": "kate", "town": "diɡuno", "road": "kʷapes", "river": "kʷujo", "sea": "okʷo", "forest": "meɡapi", "field": "kʷekʷote", "wind": "tikʷapa", "thunder": "akʷuɡe", "day": "wi", "year": "raloto", "morning": "kit", "food": "tehabe", "grain": "we", "salt": "pale", "animal": "pakʷa", "horse": "kʷulat", "boat": "kʷita", "trade": "daɡe", "king": "ade", "law": "eroh", "war": "pekʷ", "peace": "kapo", "god": "aɡi", "spirit": "wame", "ritual": "kaka", "write": "iso", "read": "tawino", "speak": "saru", "language": "bodipe", "friend": "tutat", "enemy": "pek", "work": "kara", "make": "puhudi", "carry": "kʷaɡik", "open": "kʷetida", "close": "de", "near": "petomet", "far": "pupudep", "old": "tawihek", "young": "kʷibakʷ", "fast": "dape", "slow": "kʷoma"};
  // --- jména z protojazyka: tvar (IPA), přepis a význam ---
  const NAME_MOD = /[̀-ͯʰ-˿]/;
  function nameSegs(s) { const v = []; for (const ch of s) { if (v.length && (NAME_MOD.test(ch) || v[v.length - 1].endsWith('͡'))) v[v.length - 1] += ch; else v.push(ch); } return v; }
  const ROM = { 'kʷ': 'kw', 'ɡʷ': 'gw', 'ɡ': 'g', 'ʃ': 'š', 'ʒ': 'ž', 't͡ʃ': 'č', 'd͡ʒ': 'dž', 't͡s': 'c', 'd͡z': 'dz', 'ŋ': 'ng', 'ɲ': 'ň', 'θ': 'th', 'ð': 'dh',
    'x': 'ch', 'ɣ': 'gh', 'ʔ': '’', 'ə': 'e', 'ɛ': 'e', 'æ': 'ä', 'ø': 'ö', 'ɔ': 'o', 'ʊ': 'u', 'ɪ': 'i', 'y': 'ü', 'ɨ': 'y', 'β': 'v', 'ɸ': 'f', 'χ': 'ch',
    'ʁ': 'r', 'ħ': 'h', 'ɦ': 'h', 'ʎ': 'ľ', 'ɬ': 'hl', 'c': 'ť', 'ɟ': 'ď', 'ɢ': 'g', 'ʋ': 'v', 'ɹ': 'r', 'ɰ': 'g', 'ʝ': 'j', 'ɑ': 'a', 'ɒ': 'o', 'ʌ': 'a' };
  // Složeniny se ve jménech zkracují jako skutečná místní jména: první část na slabiku, celek nejvýš na tři slabiky.
  const NAME_VOWEL = /^[aeiouyæøɛɔəɪʊɨʉɯɤʌœɞɶɑɒɘɵʏ]/;
  function nameSyllables(ipa) {
    const S = nameSegs(ipa), out = [[]];
    S.forEach((x, i) => {
      const cur = out[out.length - 1], hasV = cur.some(y => NAME_VOWEL.test(y));

    if (UI.pick && sel && sel.regions) {
      remember(); const at = sel.regions.indexOf(r.id); if (at >= 0) sel.regions.splice(at, 1); else sel.regions.push(r.id);
      if ((sel.kind === 'state' || sel.kind === 'secession') && !sel.regions.includes(sel.capital)) sel.capital = sel.regions[0] || null;
      renderAll(); return;
    }
    const st = situation(UI.year).owner.get(r.id);
    if (st) { UI.selected = allStates().get(st).uid; UI.pick = false; renderAll(); }
  });

  // --- kronika ---
  const chron = document.getElementById('chron');
  const laneOf = e => (e.kind === 'state' || e.kind === 'secession' ? e.id : e.kind === 'annexation' || e.kind === 'collapse' || e.kind === 'language_policy' || e.kind === 'border_policy' ? e.state
    : e.kind === 'standard' || e.kind === 'schools' ? e.of : e.kind === 'lingua_franca' ? '_lf' : '_regions');
  const pct = y => `${(y / END) * 100}%`;
  function lifespan(st) {
    const end = E.filter(e => e.kind === 'collapse' && e.state === st.id).map(e => e.year).sort((a, b) => a - b)[0];
    let lost = null;
    for (let y = st.year; y <= END && lost === null; y += STEP) { if (y > (end ?? END)) break; if (y > st.year && !situation(y).states.has(st.id)) lost = y; }
    return [st.year, lost ?? end ?? END];
  }
  function renderChron() {
    const states = allStates(), notes = situation(END).notes, bad = new Set(notes.map(n => n[0].uid));
    let html = '<div></div><div class="ruler" id="ruler">';
    for (let y = 0; y <= END; y += 100) html += `<i style="left:${pct(y)}"></i>` + (y % 250 === 0 ? `<span style="left:${pct(y)}${y === 0 ? ';transform:none' : y === END ? ';transform:translateX(-100%)' : ''}">${y}</span>` : '');
    html += '</div>';
    const lane = (label, key, sub, inner) => `<div class="lab${sub ? ' sub' : ''}"><span title="${label}">${label}</span></div><div class="track" data-lane="${key}">${inner}</div>`;
    const markers = key => E.filter(e => laneOf(e) === key).map(e => {
      const k = KINDS[e.kind], label = typeof k.short === 'function' ? k.short(e) : k.short;
      return `<button class="mk${bad.has(e.uid) ? ' err' : ''}" data-uid="${e.uid}" style="left:${pct(e.year)}" aria-pressed="${e.uid === UI.selected}" title="${e.year}: ${k.cz}"><span>${label}</span></button>`;
    }).join('');
    for (const st of states.values()) {
      const [from, to] = lifespan(st), segs = [];
      let policy = st.policy, at = from;
      for (const e of E.filter(x => x.kind === 'language_policy' && x.state === st.id && x.year > from && x.year < to).sort((a, b) => a.year - b.year)) { segs.push([at, e.year, policy]); policy = e.policy; at = e.year; }
      segs.push([at, to, policy]);
      const bar = `<div class="bar" style="left:${pct(from)};width:${(to - from) / END * 100}%">${segs.map(([a, b, p]) => `<div class="p p-${p}" style="width:${(b - a) / (to - from) * 100}%" title="${a}–${b}: ${POLICY[p][0]}"></div>`).join('')}</div>`;
      html += lane(st.name, st.id, false, bar + markers(st.id));
    }
    html += lane('Lingua franca', '_lf', true, markers('_lf'));
    html += lane('Kraje', '_regions', true, markers('_regions') + REGION_PERIODS.map(p => `<span class="mk ro" style="left:${pct(p.year)}" title="Nastaveno v editoru světa"><span>${RB[p.region].name}: ${p.text}</span></span>`).join(''));
    html += `<div class="cursor" id="cursor" style="left:calc(170px + (100% - 170px) * ${UI.year / END})"><b>${UI.year}</b></div>`;
    chron.innerHTML = html;
    // Popisky blízkých značek by se překryly; skryjí se a zůstane jen čárka s titulkem.
    chron.querySelectorAll('.track').forEach(tr => {
      let right = -Infinity;
      [...tr.querySelectorAll('.mk')].sort((a, b) => a.offsetLeft - b.offsetLeft).forEach(m => {
        if (m.offsetLeft < right + 4) m.classList.add('tight'); else right = m.offsetLeft + m.offsetWidth;
      });
    });
    const ruler = document.getElementById('ruler');
    const yearAt = x => { const r = ruler.getBoundingClientRect(); return Math.max(0, Math.min(END, Math.round((x - r.left) / r.width * END / STEP) * STEP)); };
    ruler.addEventListener('pointerdown', e => { ruler.setPointerCapture(e.pointerId); setYear(yearAt(e.clientX)); ruler.dataset.drag = '1'; });
    ruler.addEventListener('pointermove', e => { if (ruler.dataset.drag) setYear(yearAt(e.clientX)); });
    ruler.addEventListener('pointerup', () => { delete ruler.dataset.drag; });
    chron.querySelectorAll('.mk[data-uid]').forEach(m => {
      const e = E.find(x => x.uid === +m.dataset.uid);
      m.addEventListener('pointerdown', p => { m.setPointerCapture(p.pointerId); m.dataset.x = p.clientX; m.dataset.moved = ''; });
      m.addEventListener('pointermove', p => {
        if (m.dataset.x === undefined || !m.hasPointerCapture(p.pointerId)) return;
        if (!m.dataset.moved && Math.abs(p.clientX - m.dataset.x) < 4) return;
        if (!m.dataset.moved) { remember(); m.dataset.moved = '1'; }
        e.year = Math.max(0, Math.min(END, yearAt(p.clientX))); m.style.left = pct(e.year); m.title = `${e.year}: ${KINDS[e.kind].cz}`;
      });
      m.addEventListener('pointerup', () => { const moved = m.dataset.moved; delete m.dataset.x; UI.selected = e.uid; if (moved) UI.year = e.year; renderAll(); });
      m.addEventListener('keydown', k => { if (k.key !== 'ArrowLeft' && k.key !== 'ArrowRight') return; k.preventDefault(); remember(); e.year = Math.max(0, Math.min(END, e.year + (k.key === 'ArrowRight' ? STEP : -STEP))); UI.selected = e.uid; renderAll(); chron.querySelector(`.mk[data-uid="${e.uid}"]`)?.focus(); });
    });
  }
  function setYear(y) { UI.year = y; const c = document.getElementById('cursor'); c.style.left = `calc(170px + (100% - 170px) * ${y / END})`; c.querySelector('b').textContent = y; draw(); }

  // --- karta události ---
  const insp = document.getElementById('insp');
  const seg = (field, table, value) => `<div class="seg" role="group">${Object.entries(table).map(([v, [l]]) => `<button type="button" data-field="${field}" data-v="${v}" aria-pressed="${v === value}">${l}</button>`).join('')}</div>`;
  const row = (label, body, why) => `<div class="row"><dt class="caps">${label}</dt><dd>${body}</dd>${why ? `<dd class="why">${why}</dd>` : ''}</div>`;
  const stateSelect = (field, value) => `<select data-field="${field}">${[...allStates().values()].map(s => `<option value="${s.id}"${s.id === value ? ' selected' : ''}>${s.name}</option>`).join('')}</select>`;
  const regionChips = e => `<div class="chips">${e.regions.map(id => `<span>${RB[id]?.name || id}</span>`).join('') || '<span class="why" style="border:0;background:none;padding:0">žádné</span>'}</div>
    <button type="button" class="pick" id="pick" aria-pressed="${UI.pick}">${UI.pick ? 'Hotovo' : 'Vybrat kraje na mapě'}</button>`;
  function renderInspector() {
    const e = E.find(x => x.uid === UI.selected);
    document.getElementById('pickhint').hidden = !(UI.pick && e && e.regions);
    if (!e) { renderOverview(); return; }
    const k = KINDS[e.kind], notes = situation(END).notes.filter(n => n[0].uid === e.uid);
    let body = '';
    if (e.kind === 'state' || e.kind === 'secession') {
      body += row('Kraje', regionChips(e), e.kind === 'secession' ? 'Kraje se odtrhnou od státu, ke kterému patřily.' : null);
      body += row('Hlavní město', `<select data-field="capital">${e.regions.map(id => `<option value="${id}"${id === e.capital ? ' selected' : ''}>${RB[id].name}</option>`).join('')}</select>`, 'Řeč hlavního města má prestiž; ostatní kraje se k ní přibližují.');
      body += row('Vláda', seg('centralization', CENTRAL, e.centralization), CENTRAL[e.centralization][1]);
      body += row('Jazyková politika', seg('policy', POLICY, e.policy), POLICY[e.policy][1]);
      body += row('Hranice', seg('border', BORDER, e.border), BORDER[e.border][1]);
      const later = E.filter(x => [x.state, x.of].includes(e.id) && x.uid !== e.uid).sort((a, b) => a.year - b.year);
      body += row('Co se se státem děje dál', later.map(x => `<button type="button" class="link" data-goto="${x.uid}">${x.year} ${KINDS[x.kind].cz.toLowerCase()}</button>`).join('<br>') || '<span class="why">Zatím nic. Přidej událost tlačítkem + Událost.</span>');
    } else if (e.kind === 'annexation') {
      body += row('Stát', stateSelect('state', e.state)) + row('Kraje', regionChips(e), k.desc + ' Když tím získá hlavní město jiného státu, ten zanikne.');
    } else if (e.kind === 'collapse') {
      body += row('Stát', stateSelect('state', e.state), 'Vláda padne a kraje zůstanou bez státu. Hranice zmizí, nářečí se začnou zase slévat.');
    } else if (e.kind === 'language_policy') {
      body += row('Stát', stateSelect('state', e.state)) + row('Nová politika', seg('policy', POLICY, e.policy), POLICY[e.policy][1]);
    } else if (e.kind === 'border_policy') {
      body += row('Stát', stateSelect('state', e.state)) + row('Hranice', seg('border', BORDER, e.border), BORDER[e.border][1]);
    } else if (e.kind === 'standard') {
      body += row('Stát', stateSelect('of', e.of), 'Písaři u dvora ustálí, jak se píše. Psaná podoba se pak mění pomaleji než mluvená.') + row('Kdo umí psát', seg('literacy', LITERACY, e.literacy), LITERACY[e.literacy][1]);
    } else if (e.kind === 'schools') {
      body += row('Stát', stateSelect('of', e.of)) + row('Kde', seg('coverage', COVERAGE, e.coverage), COVERAGE[e.coverage][1]);
      body += row('Navíc', `<label class="toggle"><input type="checkbox" data-bool="printing"${e.printing ? ' checked' : ''}> Tisk</label><label class="toggle"><input type="checkbox" data-bool="diglossic"${e.diglossic ? ' checked' : ''}> Diglosie</label>`,
        'Tisk: norma se šíří rychleji a mění se pomaleji. Diglosie: ve škole se píše normou, doma se dál mluví nářečím a obojí žije vedle sebe.');
    } else if (e.kind === 'lingua_franca') {
      body += row('Odkud', `<select data-field="source">${REGIONS.map(r => `<option value="${r.id}"${r.id === e.source ? ' selected' : ''}>${r.name}</option>`).join('')}</select>`, 'Řeč tohoto kraje se stane společnou řečí.');
      body += row('Kde se jí mluví', regionChips(e)) + row('Jak moc', seg('spread', SPREAD, e.spread), SPREAD[e.spread][1]);
      body += row('Doma', `<label class="toggle"><input type="checkbox" data-bool="nativize"${e.nativize ? ' checked' : ''}> Děti ji přejímají za mateřštinu</label>`, 'Pak může místní jazyk časem zaniknout.');
    } else if (e.kind === 'revival') {
      body += row('Kraje', regionChips(e)) + row('Síla', seg('strength', STRENGTH, e.strength), STRENGTH[e.strength][1]);
    } else if (e.kind === 'preserve') {
      body += row('Kraje', regionChips(e)) + row('Ochrana', `<label class="toggle"><input type="checkbox" data-bool="preserved"${e.preserved ? ' checked' : ''}> Jazyk nevymře</label>`, 'Autorův zásah mimo běh dějin: lidé jazyk dál předávají dětem.');
    }
    const title = e.kind === 'state' || e.kind === 'secession' ? `<input class="title-input" id="f-name" value="${e.name.replace(/"/g, '&quot;')}" aria-label="Jméno státu">` : `<div class="title-input" style="border-bottom-color:var(--rule)">${k.cz}</div>`;
    insp.innerHTML = `<div><div class="caps">${k.cz}</div>${title}</div>
      <dl class="ledger">${row('Rok', `<input type="number" id="f-year" min="0" max="${END}" step="${STEP}" value="${e.year}" aria-label="Rok">`)}${body}</dl>
      ${notes.length ? `<ul class="checks">${notes.map(n => `<li>${n[1]}</li>`).join('')}</ul>` : ''}
      <button type="button" class="danger" id="f-remove">Odstranit událost</button>`;
    document.getElementById('f-year').addEventListener('change', x => { remember(); e.year = Math.max(0, Math.min(END, Math.round(+x.target.value / STEP) * STEP)); UI.year = e.year; renderAll(); });
    const nm = document.getElementById('f-name'); if (nm) { nm.addEventListener('focus', () => remember(), { once: true }); nm.addEventListener('input', () => { e.name = nm.value; renderChron(); draw(); }); }
    insp.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { remember(); e[b.dataset.field] = b.dataset.v; renderAll(); }));
    insp.querySelectorAll('select[data-field]').forEach(s => s.addEventListener('change', () => { remember(); e[s.dataset.field] = s.value; renderAll(); }));
    insp.querySelectorAll('input[data-bool]').forEach(c => c.addEventListener('change', () => { remember(); e[c.dataset.bool] = c.checked; renderAll(); }));
    insp.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { const x = E.find(y => y.uid === +b.dataset.goto); UI.selected = x.uid; UI.year = x.year; UI.pick = false; renderAll(); }));
    const pick = document.getElementById('pick'); if (pick) pick.addEventListener('click', () => { UI.pick = !UI.pick; renderInspector(); draw(); });
    document.getElementById('f-remove').addEventListener('click', () => {
      remember(); const gone = new Set([e.uid]);
      if (e.kind === 'state' || e.kind === 'secession') E.filter(x => [x.state, x.of].includes(e.id)).forEach(x => gone.add(x.uid));
      E = E.filter(x => !gone.has(x.uid)); UI.selected = null; UI.pick = false; renderAll();
    });
  }
  function renderOverview() {
    const notes = situation(END).notes;
    insp.innerHTML = `<div><div class="caps">Dějiny</div><div class="title-input" style="border-bottom-color:var(--rule)">${E.length} událostí</div></div>
      <p class="why">Vyber událost v kronice nebo stát na mapě. Novou přidáš tlačítkem + Událost; vznikne v roce pod kurzorem.</p>
      <div><div class="caps" style="margin-bottom:6px">Kontrola</div><ul class="checks">${notes.length ? notes.map(([e, t]) => `<li><button type="button" data-goto="${e.uid}">${e.year} ${KINDS[e.kind].cz.toLowerCase()}: ${t}</button></li>`).join('') : '<li class="ok">Dějiny dávají smysl.</li>'}</ul></div>`;
    insp.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { const x = E.find(y => y.uid === +b.dataset.goto); UI.selected = x.uid; UI.year = x.year; renderAll(); }));
  }

  // --- nová událost ---
  const menu = document.getElementById('menu'), add = document.getElementById('add');
  menu.innerHTML = Object.entries(KINDS).map(([kind, k]) => `<button type="button" data-kind="${kind}">${k.cz}<small>${k.desc}</small></button>`).join('');
  add.addEventListener('click', () => { menu.hidden = !menu.hidden; add.setAttribute('aria-expanded', String(!menu.hidden)); });
  document.addEventListener('click', e => { if (!menu.hidden && !e.target.closest('#menu, #add')) { menu.hidden = true; add.setAttribute('aria-expanded', 'false'); } });
  menu.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    remember(); menu.hidden = true; add.setAttribute('aria-expanded', 'false');
    const kind = b.dataset.kind, sit = situation(UI.year), anyState = [...sit.states.keys()][0] || [...allStates().keys()][0] || null;
    const base = { kind, year: UI.year };
    if (kind === 'state' || kind === 'secession') { let n = allStates().size + 1, id = `stat-${n}`; while (allStates().has(id)) id = `stat-${++n}`; Object.assign(base, { id, name: 'Nový stát', regions: [], capital: null, centralization: 'moderate', policy: 'tolerant', border: 'normal' }); }
    else if (kind === 'annexation') Object.assign(base, { state: anyState, regions: [] });
    else if (kind === 'collapse') Object.assign(base, { state: anyState });
    else if (kind === 'language_policy') Object.assign(base, { state: anyState, policy: 'promoted' });
    else if (kind === 'border_policy') Object.assign(base, { state: anyState, border: 'closed' });
    else if (kind === 'standard') Object.assign(base, { of: anyState, literacy: 'elite' });
    else if (kind === 'schools') Object.assign(base, { of: anyState, coverage: 'mass', printing: true, diglossic: false });
    else if (kind === 'lingua_franca') Object.assign(base, { source: REGIONS[0].id, regions: [], spread: 'common', nativize: false });
    else if (kind === 'revival') Object.assign(base, { regions: [], strength: 'movement' });
    else if (kind === 'preserve') Object.assign(base, { regions: [], preserved: true });
    const e = ev(base); E.push(e); UI.selected = e.uid; UI.pick = !!e.regions; renderAll();
  }));

  // --- zápatí ---
  function spec() {
    const out = E.slice().sort((a, b) => a.year - b.year || a.uid - b.uid).map(e => {
      const { uid: _u, name: _n, ...rest } = e;
      if ((rest.kind === 'state' || rest.kind === 'secession') && !rest.capital) delete rest.capital;
      return rest;
    });
    return { events: out };
  }
  function renderFooter() {
    const states = allStates().size, notes = situation(END).notes.length;
    document.getElementById('counts').innerHTML = `<b>${E.length}</b> událostí · <b>${states}</b> ${states === 1 ? 'stát' : states < 5 ? 'státy' : 'států'} · jazyk ${LANG.name}` + (notes ? ` · <span style="color:var(--warn)">${notes} k prověření</span>` : '');
    if (!document.getElementById('spec').hidden) {
      document.getElementById('spec-json').textContent = JSON.stringify(spec(), null, 1);
      document.getElementById('spec-note').textContent = 'Jména států engine zatím neukládá; jsou jen v projektu aplikace.';
    }
    document.getElementById('undo').disabled = !history.length;
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('show-spec').addEventListener('click', e => { const b = document.getElementById('spec'); b.hidden = !b.hidden; e.currentTarget.setAttribute('aria-expanded', String(!b.hidden)); renderFooter(); });
  let toastTimer = null;
  document.getElementById('run').addEventListener('click', () => { const s = document.getElementById('saved'); s.textContent = 'Běh se v prototypu nespouští.'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { s.textContent = 'Všechny změny uložené'; }, 2400); });
  document.querySelectorAll('.path a').forEach(a => a.addEventListener('click', x => x.preventDefault()));
  let savedTimer = null;
  function saved() { const s = document.getElementById('saved'); s.textContent = 'Ukládám…'; clearTimeout(savedTimer); savedTimer = setTimeout(() => { s.textContent = 'Všechny změny uložené'; }, 500); }
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, select, textarea')) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if (e.key === 'Escape') { UI.pick = false; UI.selected = null; renderAll(); }
  });

  function renderAll() { renderChron(); renderInspector(); draw(); renderFooter(); }
  new ResizeObserver(() => { layout(); draw(); }).observe(stage);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { hatchCache.clear(); draw(); });
  new MutationObserver(() => { hatchCache.clear(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  layout(); renderAll();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>

</html>
