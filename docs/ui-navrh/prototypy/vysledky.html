<style>
@font-face { font-family: "Charis CEE"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
/* Layout: záložky výsledků; Jazyky = mapa vesnic obarvená jazykem nad řekou jazyků v čase, vpravo karta jazyka; Slovník = srovnávací tabulka a vrt slova. */
:root {
  --sea: #bccad0; --sea-line: #eef3f4; --land: #fbfbf9; --ink: #1b2830; --ink-2: #56656e; --ink-3: #a7b3b9; --rule: #d1d9dc;
  --panel: #eef1f2; --field: #f7f9f9; --isogloss: #ae2a1f; --halo: rgba(251, 251, 249, 0.9); --grain: 0.07;
  --l0: #2a6fc9; --l1: #c48a12; --l2: #16956a; --l3: #7d4fc0; --l4: #8a9a12; --l5: #c4508a;
  --stratum-a: #e6ebec; --stratum-b: #dbe2e4;
  --f-ui: "Piazzolla", Georgia, serif; --f-ipa: "Charis CEE", "Charis SIL", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
    --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --halo: rgba(23, 32, 42, 0.86); --grain: 0.05;
    --l0: #4f8de0; --l1: #b47e18; --l2: #22a074; --l3: #9a72dc; --l4: #869217; --l5: #d05f98;
    --stratum-a: #16212b; --stratum-b: #1c2833; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d141b; --sea-line: #2c4556; --land: #17202a; --ink: #ecdfc5; --ink-2: #8e99a3; --ink-3: #4d5a65; --rule: #26323d;
  --panel: #111a22; --field: #16212b; --isogloss: #e8806f; --halo: rgba(23, 32, 42, 0.86); --grain: 0.05;
  --l0: #4f8de0; --l1: #b47e18; --l2: #22a074; --l3: #9a72dc; --l4: #869217; --l5: #d05f98;
  --stratum-a: #16212b; --stratum-b: #1c2833; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--isogloss); outline-offset: 2px; }
.ipa { font-family: var(--f-ipa); }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.why { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.38; margin: 0; }

.app { height: 100%; display: grid; gap: 10px 16px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "tabs tabs" "main insp" "foot foot"; }
.top { grid-area: top; display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.project { font-size: 22px; font-style: italic; }
.project small { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 8px; }
.path { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; align-items: baseline; }
.path li { display: flex; align-items: baseline; gap: 4px; }
.path li + li::before { content: ""; width: 22px; border-top: 1px dotted var(--ink-2); align-self: center; }
.path a { color: var(--ink-2); text-decoration: none; padding: 2px 4px; }
.path a b { font-weight: 500; font-size: 11px; margin-right: 4px; }
.path a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--isogloss); }
.saved { margin-left: auto; font-size: 12px; color: var(--ink-2); font-style: italic; }
.tabs { grid-area: tabs; display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
.tabs button, .tabs a { background: none; border: 0; padding: 2px 0; cursor: pointer; font-size: 17px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; }
.tabs [aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.tabs [disabled] { opacity: 0.45; cursor: default; }
.tabs .yr { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
.tabs .yr b { font-size: 26px; font-variant-numeric: tabular-nums lining-nums; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--land); cursor: pointer; display: grid; place-items: center; align-self: center; }
.play svg { fill: var(--ink); }

/* jazyky */
.main { grid-area: main; min-height: 0; min-width: 0; display: grid; gap: 8px; grid-template-rows: minmax(0, 1fr) auto; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--sea); border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--land); border: 1px solid var(--ink); padding: 4px 8px; font-size: 13px; border-radius: 2px; white-space: nowrap; z-index: 4; }
.maplegend { position: absolute; left: 12px; bottom: 10px; background: var(--halo); padding: 6px 10px; border-radius: 2px; font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
.maplegend div { display: flex; gap: 8px; align-items: center; }
.river { position: relative; height: 210px; }
.river svg { width: 100%; height: 100%; display: block; overflow: visible; }
.river .area { cursor: pointer; }
.river text { font-family: var(--f-ui); }
.rtip { position: absolute; top: 0; pointer-events: none; background: var(--land); border: 1px solid var(--ink); padding: 5px 8px; font-size: 12.5px; border-radius: 2px; z-index: 4; min-width: 170px; }
.rtip div { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.rtip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* karta */
.insp { grid-area: insp; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
.lang-title { display: flex; align-items: center; gap: 10px; }
.lang-title i { width: 18px; height: 18px; border-radius: 3px; flex: none; }
.lang-title h2 { margin: 0; font-size: 26px; line-height: 1.1; }
.endo { font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.endo .ipa { font-size: 16px; }
.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.words { list-style: none; margin: 0; padding: 0; display: grid; }
.words li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.words .g { color: var(--ink-2); font-size: 13px; }
.words .p { font-family: var(--f-ipa); color: var(--ink-2); font-size: 15px; }
.words .n { font-family: var(--f-ipa); font-size: 18px; text-align: right; }
.tag { font-family: var(--f-ui); font-size: 11px; font-style: italic; color: var(--isogloss); margin-left: 4px; }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; text-align: left; }
.link:hover { color: var(--ink); }
.langlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.langlist button { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: none; border: 0; padding: 4px 6px; border-radius: 2px; cursor: pointer; text-align: left; font-size: 14px; }
.langlist button[aria-pressed="true"] { background: var(--field); font-weight: 700; }
.langlist button.dead { color: var(--ink-2); font-style: italic; }
.langlist i { width: 12px; height: 12px; border-radius: 2px; }
.langlist small { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; }

/* slovník */
.dict { grid-area: main; min-height: 0; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.dict-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.search { border: 0; border-bottom: 1px solid var(--ink-2); background: none; padding: 3px 0; width: 220px; }
.table-wrap { overflow: auto; min-height: 0; border-top: 1px solid var(--ink); }
table.cmp { border-collapse: collapse; width: 100%; }
.cmp th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; font-size: 13px; padding: 8px 10px 6px; border-bottom: 1px solid var(--ink); vertical-align: bottom; z-index: 1; }
.cmp th .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.cmp th small { display: block; font-weight: 400; color: var(--ink-2); font-style: italic; }
.cmp td { padding: 4px 10px; border-bottom: 1px solid var(--rule); font-family: var(--f-ipa); font-size: 18px; white-space: nowrap; cursor: pointer; }
.cmp td.g { font-family: var(--f-ui); font-size: 14px; color: var(--ink-2); cursor: default; }
.cmp td.proto { color: var(--ink-2); }
.cmp td:hover:not(.g) { background: var(--field); }
.cmp td[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--isogloss); }
.cmp td.none { color: var(--ink-3); }
.strata { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--ink); }
.stratum { position: relative; padding: 6px 10px 6px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
.stratum:nth-child(odd) { background: var(--stratum-a); }
.stratum:nth-child(even) { background: var(--stratum-b); }
.stratum .fm { font-family: var(--f-ipa); font-size: 20px; }
.stratum .yr { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stratum .why2 { grid-column: 1 / -1; font-size: 13px; color: var(--isogloss); }
.stratum.future { opacity: 0.3; }

.foot { grid-area: foot; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 8px; font-size: 13px; color: var(--ink-2); }
.foot b { color: var(--ink); }

@media (max-width: 980px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "top" "tabs" "main" "insp" "foot"; }
  .main { grid-template-rows: 58vh auto; }
  .dict { grid-template-rows: auto 60vh; }
  .saved, .tabs .yr { margin-left: 0; }
}
</style>

      html += `<line x1="${xx}" x2="${xx}" y1="${m.t - 6}" y2="${m.t + 2}" stroke="var(--ink-2)"/>` + (lab ? `<text x="${xx + 3}" y="${m.t - 10}" font-size="10.5" fill="var(--ink-2)">${hist[e.kind](e)}</text>` : ''); });
    html += `<line id="rcursor" x1="${x(UI.year)}" x2="${x(UI.year)}" y1="${m.t - 4}" y2="${H - m.b}" stroke="var(--isogloss)" stroke-width="1.5"/>`;
    html += `<rect id="rhit" x="${m.l}" y="0" width="${W - m.r - m.l}" height="${H}" fill="transparent" style="cursor:ew-resize"/>`;
    svg.html(html);
    const hit = svg.select('#rhit').node(), yearAt = px => Math.max(0, Math.min(END, Math.round(x.invert(px) / 50) * 50));
    const pos = ev => { const r = hit.getBoundingClientRect(); return ev.clientX - r.left + m.l; };
    let dragging = false;
    hit.addEventListener('pointerdown', ev => { dragging = true; hit.setPointerCapture(ev.pointerId); UI.year = yearAt(pos(ev)); render(); });
    hit.addEventListener('pointerup', ev => {
      dragging = false;
      const px = pos(ev), yy = ev.clientY - hit.getBoundingClientRect().top, yr = yearAt(px), row = series[F.findIndex(f => f.year === Math.max(50, yr))];
      if (row) { let acc = 0; for (const li of ORDER) { const lo = acc; acc += row[li]; if (row[li] && y(acc) <= yy && yy <= y(lo)) { UI.lang = li; render(); break; } } }
    });
    hit.addEventListener('pointermove', ev => {
      const px = pos(ev), yr = yearAt(px);
      if (dragging) { UI.year = yr; render(); }
      const row = series[F.findIndex(f => f.year === Math.max(50, yr))]; if (!row) return;
      rtip.hidden = false; rtip.style.left = Math.min(px + 12, W - 190) + 'px';
      rtip.innerHTML = `<b>${yr}</b>` + ORDER.filter(li => row[li] > 0).map(li => `<div><span><i style="background:${color(li)}"></i> ${NAMES[li]}</span><span>${row[li].toLocaleString('cs')}</span></div>`).join('');
    });
    hit.addEventListener('pointerleave', () => { rtip.hidden = true; });
  }

  // --- nářečí: fakta jako cee.v2.naming.dialects, česká jména z naming.js ---
  const DIRS = ['east', 'southeast', 'south', 'southwest', 'west', 'northwest', 'north', 'northeast'];
  function dialectsOf(li, y) {
    const f = frameAt(y), m = members(li, y); if (!m.length) return [];
    const centre = ids => [d3.mean(ids, i => P[i].x), d3.mean(ids, i => P[i].y)], c = centre(m);
    const radius = d3.max(m, i => Math.hypot(P[i].x - c[0], P[i].y - c[1])) || 0;
    const clusters = d3.groups(m, i => f.dia[i]).sort((a, b) => a[0] - b[0]);
    const facts = clusters.map(([id, ids]) => {
      const cc = centre(ids), dx = cc[0] - c[0], dy = cc[1] - c[1];
      const dir = Math.hypot(dx, dy) < 0.35 * radius ? 'center' : DIRS[Math.floor((((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360 + 22.5) % 360) / 45)];
      const regions = d3.groups(ids, i => P[i].region).sort((a, b) => b[1].length - a[1].length || (a[0] < b[0] ? -1 : 1)).map(g => g[0]);
      const terrains = new Set(regions.map(r => RB[r].terrain));
      // směr uvnitř hlavního kraje (rozliší dvě nářečí téhož kraje)
      const home = members(li, y).filter(i => P[i].region === regions[0]), hc = centre(home.length ? home : ids), lx = cc[0] - hc[0], ly = cc[1] - hc[1];
      const local = Math.hypot(lx, ly) < 2 ? 'center' : DIRS[Math.floor((((Math.atan2(ly, lx) * 180 / Math.PI + 360) % 360 + 22.5) % 360) / 45)];
      return { id, n: ids.length, regions, direction: dir, local, terrain: terrains.size === 1 ? [...terrains][0] : null, sole: clusters.length === 1 };
    });
    const labels = dialectLabels(facts, r => RB[r].name);
    return facts.map((x, k) => ({ ...x, label: labels[k] }));
  }

  // --- karta jazyka ---
  const insp = document.getElementById('insp');
  const plural = (n, a, b, c) => (n === 1 ? a : n >= 2 && n <= 4 ? b : c);
  const SAMPLE = ['water', 'fire', 'mother', 'hand', 'eye', 'stone', 'night', 'king', 'mountain', 'road'];
  function langCard() {
    const li = UI.lang, l = L[li], y = UI.year, f = frameAt(y), m = members(li, y), here = alive(li, y);
    const regions = [...new Set(m.map(i => P[i].region))], speakers = m.reduce((s, i) => s + f.pop[i], 0);
    const dialects = new Set(m.map(i => f.dia[i]).filter(d => d >= 0)).size, dnames = dialectsOf(li, y);
    const endo = endonymAt(li, Math.min(y, l.end ?? END)), i0 = rep(li, Math.min(y, l.end ?? END));
    const origin = l.parent === null ? `protojazyk ${l.code === 'pra' ? 'západu' : 'východu'}` : `odštěpila se v roce ${l.start} od jazyka ${NAMES[l.parent]}`;
    const fate = l.end != null && l.end <= y ? `vymřela v roce ${l.end}: její vsi přešly k jazyku ${NAMES[linAt(frameAt(l.end), l.at_start[0])] || '?'}` : here ? 'živý jazyk' : `vznikne až v roce ${l.start}`;
    const pub = {}; for (const r of regions) for (const [code, s] of Object.entries(f.census[r]?.public || {})) pub[code] = Math.max(pub[code] || 0, s);
    const words = SAMPLE.map(c => { const e = entryAt(c, i0, Math.min(y, l.end ?? END)), now = str(e), proto = formAt(c, l.at_start[0], 50);
      const loan = e && e[1] >= 0 && e[3] && e[3] !== l.code; return `<li><span class="g">${D.gloss[c]}</span><span class="p">*${proto ?? '∅'}</span><span class="n">${now ?? '∅'}${loan ? `<span class="tag">výp.</span>` : ''}</span></li>`; }).join('');
    insp.innerHTML = `
      <div class="lang-title"><i style="background:${color(li)}"></i><h2>${NAMES[li]}</h2></div>
      <div class="endo">sami říkají <i>${endo.endonym}</i><span class="ipa">/${endo.ipa}/</span><span class="why">„${endo.meaning}“</span></div>
      <dl class="facts">
        <dt>Původ</dt><dd>${origin}</dd>
        <dt>Stav v roce ${y}</dt><dd>${fate}</dd>
        ${here ? `<dt>Mluvčí</dt><dd>${speakers.toLocaleString('cs')} v ${m.length} ${plural(m.length, 'vsi', 'vsích', 'vsích')}</dd>
        <dt>Kraje</dt><dd>${regions.map(r => RB[r].name).join(', ')}</dd>
        <dt>Nářečí</dt><dd>${dialects}</dd>` : ''}
        <dt>Jméno</dt><dd>${l.parent === null ? 'z vlastního jména protojazyka' : NAME_FROM[li] === 'endonym' ? 'z vlastního jména, které se už liší od mateřského' : `podle kraje vzniku (${RB[P[l.at_start[0]].region].name}); vlastní jméno se zatím neliší`}</dd>
        ${Object.keys(pub).length && here ? `<dt>Na veřejnosti</dt><dd>${Object.entries(pub).map(([c, s]) => `${NAMES[familyOf(c)]} (${Math.round(s * 100)} %)`).join(', ')}</dd>` : ''}
      </dl>
      ${here && dnames.length ? `<div><div class="caps" style="margin-bottom:4px">Nářečí v roce ${y}</div><ul class="langlist">${dnames.map(d => `<li><button data-dia="${d.id}" aria-pressed="${UI.dia === d.id}"><i style="background:${color(li)};opacity:${0.95 - (d.id % 3) * 0.2}"></i><span>${d.label}</span><small>${d.n} ${plural(d.n, 'ves', 'vsi', 'vsí')}</small></button></li>`).join('')}</ul></div>` : ''}
      <div><div class="caps" style="margin-bottom:4px">Slova: protojazyk a ${here ? `rok ${y}` : 'poslední podoba'}</div><ul class="words">${words}</ul>
        <button class="link" id="to-dict" style="margin-top:6px">Celý slovník →</button></div>
      <div><div class="caps" style="margin-bottom:4px">Všechny jazyky</div><ul class="langlist">${ORDER.map(k => { const on = alive(k, y);
        return `<li><button data-li="${k}" aria-pressed="${k === li}" class="${on ? '' : 'dead'}"><i style="background:${color(k)}"></i><span>${NAMES[k]}</span><small>${on ? members(k, y).length + ' vsí' : L[k].end && L[k].end <= y ? '†' + L[k].end : 'od ' + L[k].start}</small></button></li>`; }).join('')}</ul></div>`;
    insp.querySelectorAll('[data-li]').forEach(b => b.addEventListener('click', () => { UI.lang = +b.dataset.li; UI.dia = null; render(); }));
    insp.querySelectorAll('[data-dia]').forEach(b => b.addEventListener('click', () => { UI.dia = UI.dia === +b.dataset.dia ? null : +b.dataset.dia; render(); }));
    document.getElementById('to-dict').addEventListener('click', () => setView('dict'));
  }

  // --- slovník ---
  function columns() { const y = UI.year; return ORDER.filter(li => alive(li, y)); }
  function renderTable() {
    const q = document.getElementById('search').value.trim().toLowerCase(), cols = columns(), y = UI.year;
    const protoA = L.findIndex(l => l.parent === null && l.code === 'pra'), protoB = L.findIndex(l => l.parent === null && l.code === 'vych');
    let html = `<thead><tr><th>Význam</th><th>*${NAMES[protoA]}<small>rok 0</small></th><th>*${NAMES[protoB]}<small>rok 0</small></th>` +
      cols.map(li => `<th><span class="sw" style="background:${color(li)}"></span>${NAMES[li]}<small>${endonymAt(li, y).endonym}, rok ${y}</small></th>`).join('') + '</tr></thead><tbody>';
    for (const c of CONCEPTS) {
      const pa = D.lex.pra[c], pb = D.lex.vych[c];
      const cells = cols.map(li => { const i = rep(li, y), e = entryAt(c, i, y), f = str(e), loan = e && e[1] >= 0 && e[3] && e[3] !== L[li].code;
        return { li, f, loan, src: loan ? NAMES[familyOf(e[3])] : null }; });
      if (q && !D.gloss[c].toLowerCase().includes(q) && !cells.some(x => (x.f || '').includes(q)) && !(pa || '').includes(q)) continue;
      html += `<tr><td class="g">${D.gloss[c]}</td><td class="proto">*${pa}</td><td class="proto">*${pb}</td>` +
        cells.map(x => `<td data-c="${c}" data-li="${x.li}" class="${x.f ? '' : 'none'}" aria-selected="${UI.concept === c && UI.col === x.li}" title="${x.loan ? 'výpůjčka z jazyka ' + x.src : ''}">${x.f ?? '∅'}${x.loan ? '<span class="tag">výp.</span>' : ''}</td>`).join('') + '</tr>';
    }
    document.getElementById('cmp').innerHTML = html + '</tbody>';
    document.querySelectorAll('#cmp td[data-c]').forEach(td => td.addEventListener('click', () => { UI.concept = td.dataset.c; UI.col = +td.dataset.li; UI.lang = UI.col; renderTable(); wordCard(); }));
  }
  const MOD = /[̀-ͯʰ-˿]/;
  function segs(s) { const v = []; for (const ch of s) { if (v.length && (MOD.test(ch) || v[v.length - 1].endsWith('͡'))) v[v.length - 1] += ch; else v.push(ch); } return v; }
  function diff(a, b) {
    const A = segs(a), B = segs(b), n = A.length, m = B.length, d = Array.from({ length: n + 1 }, (_, i) => { const r = new Array(m + 1).fill(0); r[0] = i; return r; });
    for (let j = 0; j <= m; j++) d[0][j] = j;
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1));
    const ops = []; let i = n, j = m;
    while (i > 0 || j > 0) { if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1)) { if (A[i - 1] !== B[j - 1]) ops.push([A[i - 1], B[j - 1]]); i--; j--; }
      else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { ops.push([A[i - 1], '∅']); i--; } else { ops.push(['∅', B[j - 1]]); j--; } }
    return { norm: d[n][m] / Math.max(n, m, 1), ops: ops.reverse() };
  }
  function wordCard() {
    const li = UI.col ?? UI.lang, c = UI.concept, i = rep(li, Math.min(UI.year, L[li].end ?? END)), rows = D.forms[c][i];
    const layers = rows.map((e, n) => ({ e, prev: rows[n - 1], from: n === 0 ? 0 : e[0], to: n + 1 < rows.length ? rows[n + 1][0] : END }));
    const note = (p, e) => { const a = str(p), b = str(e); if (b === null) return 'slovo vymizelo';
      if (e[3] && e[3] !== L[li].code) return `výpůjčka z jazyka ${NAMES[familyOf(e[3])]}`;
      if (a === null) return `nové slovo: ${{ derivation: 'odvozenina', compounding: 'složenina', coinage: 'nový kořen' }[D.origins[e[2]]] || 'nové'}`;
      const df = diff(a, b); if (df.norm > 0.6) return `nahrazeno: ${{ derivation: 'odvozenina', compounding: 'složenina', coinage: 'nový kořen', inherited: 'jiný kořen' }[D.origins[e[2]]] || 'jiný kořen'}`;
      return [...new Map(df.ops.map(o => [o.join('>'), o])).values()].slice(0, 3).map(([x, y]) => `<span class="ipa">${x} → ${y}</span>`).join(' · '); };
    insp.innerHTML = `<div><div class="caps">Vrt</div><div class="lang-title"><i style="background:${color(li)}"></i><h2>${D.gloss[c]}</h2></div>
      <p class="why" style="margin-top:4px">${NAMES[li]}, ${placeLabel(i)}: jak se slovo měnilo od protojazyka.</p></div>
      <ol class="strata">${layers.slice().reverse().map(Lr => { const f = str(Lr.e); return `<li class="stratum${Lr.from > UI.year ? ' future' : ''}" style="min-height:${Math.max(44, (Lr.to - Lr.from) * 0.12)}px">
        <span class="fm">${Lr.prev ? '' : '*'}${f ?? '∅'}</span><span class="yr">${Lr.from}–${Lr.to}</span>${Lr.prev ? `<span class="why2">${note(Lr.prev, Lr.e)}</span>` : '<span class="why2" style="color:var(--ink-2)">protojazyk</span>'}</li>`; }).join('')}</ol>
      <button class="link" id="back-lang">← Karta jazyka ${NAMES[li]}</button>`;
    document.getElementById('back-lang').addEventListener('click', () => { UI.col = null; langCard(); });
  }

  // --- přepínání, čas ---
  function setView(v) {
    UI.view = v;
    document.getElementById('tab-lang').setAttribute('aria-selected', String(v === 'lang'));
    document.getElementById('tab-dict').setAttribute('aria-selected', String(v === 'dict'));
    document.getElementById('view-lang').hidden = v !== 'lang'; document.getElementById('view-dict').hidden = v !== 'dict';
    if (v === 'lang') { layout(); }
    render();
  }
  document.getElementById('tab-lang').addEventListener('click', () => setView('lang'));
  document.getElementById('tab-dict').addEventListener('click', () => setView('dict'));
  document.getElementById('search').addEventListener('input', renderTable);
  document.querySelectorAll('.path a').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  const playBtn = document.getElementById('play'), playIcon = document.getElementById('play-icon');
  let timer = null;
  function setPlaying(on) {
    clearInterval(timer); UI.playing = on; playBtn.setAttribute('aria-label', on ? 'Zastavit' : 'Přehrát');
    playIcon.innerHTML = on ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
    if (!on) return; if (UI.year >= END) UI.year = 0;
    timer = setInterval(() => { if (UI.year >= END) { setPlaying(false); return; } UI.year += 50; render(); }, 260);
  }
  playBtn.addEventListener('click', () => setPlaying(!UI.playing));
  document.addEventListener('keydown', e => {
    if (e.target.closest('input')) return;
    if (e.key === 'ArrowRight') { UI.year = Math.min(END, UI.year + 50); render(); }
    else if (e.key === 'ArrowLeft') { UI.year = Math.max(0, UI.year - 50); render(); }
  });
  function render() {
    document.getElementById('year').textContent = UI.year;
    if (UI.view === 'lang') { drawMap(); drawRiver(); langCard(); }
    else { renderTable(); if (UI.col != null) wordCard(); else langCard(); }
    const y = UI.year, living = ORDER.filter(li => alive(li, y)), f = frameAt(y);
    document.getElementById('foot').innerHTML = `<span><b>${living.length}</b> ${plural(living.length, 'jazyk', 'jazyky', 'jazyků')} a <b>${new Set(f.dia.filter(d => d >= 0)).size}</b> nářečí v roce ${y}</span>
      <span>${L.length} jazyků za celé dějiny, ${L.filter(l => l.end != null).length} vymřel</span><span>${D.events.filter(e => e.kind === 'language_split').length} rozštěpení</span>`;
  }
  new ResizeObserver(() => { if (UI.view === 'lang') { layout(); drawMap(); drawRiver(); } }).observe(document.getElementById('view-lang'));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  layout(); render();
  if (document.fonts) document.fonts.ready.then(() => { if (UI.view === 'lang') drawMap(); });
})();
</script>

</html>
