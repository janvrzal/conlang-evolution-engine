[package]
name = "cee-desktop"
version = "0.1.0"
description = "CEE: vývoj jazyků v čase a krajině"
edition = "2021"

[lib]
name = "cee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
