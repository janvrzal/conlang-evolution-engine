[package]
name = "cee-desktop"
version = "0.1.0"
description = "CEE: vývoj jazyků v čase a krajině"
edition = "2021"

[lib]
name = "cee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Engine CEE v2 přímo v aplikaci (místo Python serveru).
cee_engine = { path = "../../rust/cee_engine" }
# Dialog „Uložit / Otevřít“ (MIT nebo Apache-2.0); soubory čte a zapisuje Rust sám.
tauri-plugin-dialog = "2"
# Výsledek běhu vedle projektu se ukládá zabalený (MIT nebo Apache-2.0).
flate2 = "1"

# Engine počítá těžce: i ve vývoji (`tauri dev`) se překládá s optimalizacemi.
[profile.dev.package.cee_engine]
opt-level = 3
[profile.dev.package.cee_core]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
