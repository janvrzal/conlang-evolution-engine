[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cee"
version = "0.1.0"
description = "Conlang Evolution Engine - A generative simulator for language change"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "panphon>=0.20.0",
    "lingpy>=2.6.11",
    "networkx>=3.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# `cee ui` spouští lokální FastAPI server; jádro enginu tyhle balíčky nepotřebuje.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cee = "cee.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
