[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cee"
version = "0.1.0"
description = "Conlang Evolution Engine - A generative simulator for language change"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "panphon>=0.20.0",
    "lingpy>=2.6.11",
    "networkx>=3.0",
    "numpy>=1.26",
    "numba>=0.61",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# `cee ui` spouští lokální FastAPI server; jádro enginu tyhle balíčky nepotřebuje.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
neo4j = [
    "neo4j>=5.14.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
cee = "cee.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: brány milníků enginu v2 (dlouhé simulace); rychlá sada: pytest -m \"not slow\"",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/cee"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
