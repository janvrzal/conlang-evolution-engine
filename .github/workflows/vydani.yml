# Vydání aplikace ke stažení pro macOS, Windows a Linux.
#
# - Tag `v*` (např. `git tag v0.1.0 && git push origin v0.1.0`): sestaví balíčky a připojí je
#   ke KONCEPTU vydání na stránce Releases; zveřejní ho až člověk (Publish release).
# - Ručně (Actions → Vydání → Run workflow): jen sestaví balíčky jako artefakty běhu.
#
# Verze balíčků je `version` v desktop/src-tauri/tauri.conf.json (má sedět s tagem).
# macOS: zatím bez podpisu a notarizace; aplikace se poprvé otevře pravým tlačítkem → Otevřít.
# Podpis: přidat tajemství APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID a předat je kroku tauri-action jako env (desktop/README.md).
name: Vydání

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon i Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Systémové knihovny (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Překladač (rust-toolchain.toml) a cíle
        shell: bash
        run: |
          rustup show active-toolchain
          if [ -n "${{ matrix.targets }}" ]; then rustup target add $(echo "${{ matrix.targets }}" | tr ',' ' '); fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Závislosti UI
        working-directory: desktop
        run: npm ci
      - name: Sestavení a vydání
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CEE {0}', github.ref_name) || '' }}
          releaseBody: |
            CEE: vývoj jazyků v čase a krajině.

            **Stažení:** macOS `.dmg`, Windows `.msi` nebo `-setup.exe`, Linux `.AppImage` nebo `.deb`.

            macOS: aplikace zatím není podepsaná. Při prvním spuštění ji otevřete pravým tlačítkem → Otevřít.
          releaseDraft: true
          prerelease: false
      - name: Balíčky jako artefakt běhu (ruční spuštění)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: cee-${{ runner.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
