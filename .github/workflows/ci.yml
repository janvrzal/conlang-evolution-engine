# CI pro každý push a pull request: engine v Rustu a desktopová aplikace.
# (Python server a stará složka ui/ se tu nekontrolují.)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Překladač (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Formátování
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --workspace --exclude cee_py --all-targets -- -D warnings
      - name: Testy (engine, jádra, úložiště)
        run: cargo test --release --workspace --exclude cee_py --no-fail-fast

  desktop:
    name: Aplikace (UI a backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Systémové knihovny pro Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Překladač (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Závislosti UI
        working-directory: desktop
        run: npm ci
      - name: Kontrola typů UI
        working-directory: desktop
        run: npm run check
      - name: Testy UI
        working-directory: desktop
        run: npm test
      - name: Sestavení UI
        working-directory: desktop
        run: npm run build
      - name: Formátování backendu
        working-directory: desktop/src-tauri
        run: cargo fmt -- --check
      - name: Clippy backendu
        working-directory: desktop/src-tauri
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Testy backendu
        working-directory: desktop/src-tauri
        run: cargo test --release --lib --no-fail-fast
