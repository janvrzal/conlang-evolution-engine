name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CEE
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Lint backend
        run: python -m ruff check src tests scripts
      - name: Type-check backend
        run: python -m mypy
      - name: Run Python tests with coverage
        run: python -m pytest --cov=cee --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Type-check UI
        run: npm run check
      - name: Lint UI
        run: npm run lint
      - name: Run UI tests
        run: npm test
      - name: Build UI
        run: npm run build
