name: Rust

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --workspace --exclude cee_py --all-targets -- -D warnings
      - name: Tests (engine, jádra, úložiště)
        run: cargo test --release --workspace --exclude cee_py --no-fail-fast

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: UI dependencies
        working-directory: desktop
        run: npm ci
      - name: Type-check UI
        working-directory: desktop
        run: npm run check
      - name: UI tests
        working-directory: desktop
        run: npm test
      - name: Build UI (frontendDist for Tauri)
        working-directory: desktop
        run: npm run build
      - name: Backend format
        working-directory: desktop/src-tauri
        run: cargo fmt -- --check
      - name: Backend clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Backend tests
        working-directory: desktop/src-tauri
        run: cargo test --release --lib --no-fail-fast
