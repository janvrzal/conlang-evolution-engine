# Příklad topologie pro CEE
nodes:
  - id: proto
  - id: north
    map:
      compound_head: initial
    # Složeniny se dřív vytvářely natvrdo v simulator.py; teď je řídí topologie.
    compounds:
      - head: "město"
        modifier: "zlatý"
        id: "zlaté_město"
      - head: "vlk"
        modifier: "velký"
        id: "velký_vlk"
  - id: south
    map:
      compound_head: final
    compounds:
      - head: "město"
        modifier: "zlatý"
        id: "zlaté_město"
      - head: "vlk"
        modifier: "velký"
        id: "velký_vlk"

vertical_edges:
  - parent: proto
    child: north
    rules:
      - name: "Lenice ptk -> bdg"
        year: 200
        target: {"cons": "+", "cont": "-", "voi": "-"}
        env_before: {"syl": "+"}
        env_after: {"syl": "+"}
        action: {"voi": "+"}
  - parent: proto
    child: south
    rules:
      - name: "Ztráta koncového t a m"
        year: 300
        target: {"cons": "+"}
        env_after: {"_boundary": "+"}
        action: {"delete": "+"}

contact_edges:
  # V roce 400 Jih přejme od Severu několik slov
  - year: 400
    source: north
    target: south
    volume: 5
